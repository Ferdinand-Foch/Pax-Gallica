rhenish_resistance_light: "Résistance civile légère"
rhenish_resistance_light_desc: "Vitesse de construction : -9,09 %. Ressources de l'État : -10 %. Croissance de la compliance : -10 %. Besoins de garnison : +0 %. Dégâts de résistance aux garnisons : +0 %. Risque de sabotage des constructions : +0 %. Ces effets s'ajoutent aux autres facteurs d'occupation."
