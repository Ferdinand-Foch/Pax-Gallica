rhenish_resistance_general_desc: "Vitesse de construction : -20 %. Ressources de l'État : -25 %. Croissance de la compliance : -25 %. Besoins de garnison : +10 %. Dégâts de résistance aux garnisons : +0 %. Risque de sabotage des constructions : +0 %. Ces effets s'ajoutent aux autres facteurs d'occupation."
rhenish_resistance_sabotage: "Actes de sabotage"
rhenish_resistance_sabotage_desc: "Vitesse de construction : -33,33 %. Ressources de l'État : -50 %. Croissance de la compliance : -50 %. Besoins de garnison : +50 %. Dégâts de résistance aux garnisons : +0 %. Risque de sabotage des constructions : +10 %. Ces effets s'ajoutent aux autres facteurs d'occupation."
rhenish_resistance_armed: "Résistance armée"
rhenish_resistance_armed_desc: "Vitesse de construction : -50 %. Ressources de l'État : -75 %. Croissance de la compliance : -75 %. Besoins de garnison : +100 %. Dégâts de résistance aux garnisons : +50 %. Risque de sabotage des constructions : +25 %. Ces effets s'ajoutent aux autres facteurs d'occupation."
rhenish_resistance_uprisings: "Soulèvements"
rhenish_resistance_uprisings_desc: "Vitesse de construction : -66,67 %. Ressources de l'État : -100 %. Croissance de la compliance : -100 %. Besoins de garnison : +300 %. Dégâts de résistance aux garnisons : +200 %. Risque de sabotage des constructions : +100 %. Ces effets s'ajoutent aux autres facteurs d'occupation."

rhenish_occupation: "Occupation Rhénane"
rhenish_occupation_desc: "La résistance reste contenue dans les départements rhénans sous administration française. Des contacts locaux transmettent à l’Allemagne des informations civiles, terrestres, navales et aériennes sur la France."
rhenish_concern: "Inquiétude Rhénane"
rhenish_concern_desc: "L’opposition à l’administration française s’organise dans les départements rhénans. Les troubles inquiètent l’opinion et les réseaux locaux renforcent les renseignements allemands sur la France."
rhenish_crisis: "Crise Rhénane"
rhenish_crisis_desc: "Les troubles du département rhénan le plus agité fragilisent la confiance dans le gouvernement français. Les réseaux de résistance livrent à l’Allemagne des informations dans les quatre domaines du renseignement."
rhenish_insurrection: "Insurrection Rhénane"
rhenish_insurrection_desc: "La résistance armée dans les départements rhénans ébranle la stabilité française. Les contacts de l’Allemagne disposent d’informations étendues sur la vie civile et les forces terrestres, navales et aériennes françaises."
rhenish_uprising: "Soulèvement Rhénan"
rhenish_uprising_desc: "Le soulèvement du département rhénan le plus agité provoque une profonde crise de confiance en France. Les réseaux locaux transmettent à l’Allemagne de nombreux renseignements sur les institutions et les forces françaises."

