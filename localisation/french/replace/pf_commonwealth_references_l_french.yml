l_french:
AAT_finland_continuation_war.13.desc: "\nIl semblerait que des représentants [FIN.GetAdjMP] ont contacté les grandes démocraties pour tenter de mettre fin au conflit contre [Root.GetLeLaLNP] [Root.GetName] en passant dans leur camp contre [GER.GetLeLaLNP] [GER.GetName]. Il ne s'agirait donc de rien moins que d'un changement de camp.\n\nSi les membres du Commonwealth acceptent une telle chose, il n'y aura pas grand-chose que nous pourrons faire hormis demander des compensations, mais au moins cela nous permettra de compter sur de nouveaux alliés dans la lutte contre le fascisme."
AAT_finland_continuation_war.13.t: "[FIN.GetLeLaLNPCap] [FIN.GetName] cherch[FIN.GetEEntNP]\nà rejoindre le Commonwealth"
ABDA_abdacom_desc: "L'ennemi progresse rapidement en Asie du Sud-Est et sur le Pacifique ; les membres du Commonwealth doivent agir si nous souhaitons les repousser. Établissons un commandement suprême dans lequel nous mettrons en commun nos ressources afin de coordonner nos flottes et de faire face à l'ennemi d'un seul front."
ABDA_events.5.desc: "Les [FROM.GetHabitants] nous invitent à rejoindre l'ABDACOM, un commandement suprême unique rassemblant toutes les forces du Commonwealth. Il a pour but de coordonner les forces navales, aériennes et terrestres de différentes nations afin de résister plus efficacement à l'envahisseur. En joignant cette structure inédite, nous cèderons le contrôle de nos forces, en échange de renseignements de premier choix, d'une doctrine universelle et un soutien inébranlable des membres du Commonwealth. Qu'allons-nous répondre ?"
ABDA_expand_the_command_desc: "L'ABDACOM a dépassé toutes nos espérances. Tâchons de développer ce commandement en offrant un siège à toutes les nations du Commonwealth de la région, puis en approfondissant le partage scientifique et de renseignements pour garder une longueur d'avance sur l'ennemi."
ABDA_keep_trade_open_desc: "Le caoutchouc et le pétrole [INS.GetAdjMP] sont indispensables à l'effort de guerre du Commonwealth. L'ABDACOM doit faire tout son possible pour protéger les convois qui acheminent ces ressources. Le commerce doit continuer quoi qu'il arrive."
AFG_align_with_the_commonwealth: "S'aligner avec les membres du Commonwealth"
AFG_align_with_the_commonwealth_desc: "Il nous faut parvenir à mettre de côté nos nombreux désaccords avec les Britanniques pour accentuer notre coopération avec les membres du Commonwealth. Le danger que représente l'Axe mérite tous les sacrifices."
AFG_expel_axis_nationals_desc: "Les membres du Commonwealth nous accusent de céder à leurs ennemis du fait du nombre de citoyens des nations belligérantes qui sont autorisés à poursuivre librement leurs activités [ROOT.GetAuEnANP] [ROOT.GetNonIdeologyName]. Bien que nous n'ayons pas de preuves que leurs actions sont contraires à nos intérêts, nous devrions rassurer les membres du Commonwealth en exigeant le départ de ces personnes jusqu'à la fin du conflit mondial actuel."
AFG_expel_commonwealth_nationals: "Expulser les ressortissants des membres du Commonwealth"
AFG_expel_commonwealth_nationals_desc: "Les puissances de l'Axe nous ont présenté des preuves pour le moins douteuses que les membres du Commonwealth cherchent à usurper notre régime. Elles affirment que le seul moyen de nous protéger est de chasser de notre pays tous les citoyens des nations alliées pour nous débarrasser du même coup de leurs espions."
AFG_future_of_balochistan_desc: "Il est vrai que nous collaborons avec les membres du Commonwealth pour l'instant, mais nous devons réfléchir à la politique à long terme de notre région. Nous devrions donc insister pour que le Baloutchistan devienne indépendant. Ainsi, nous pourrons l'influencer avant qu'il ne soit annexé par un État plus grand."
AFG_linchpin_of_global_defense_desc: "Les membres du Commonwealth continuent de considérer notre allégeance comme un atout dans leur position géopolitique face à nos adversaires communs. Nous devrions en tirer parti en réclamant davantage d'investissements dans nos infrastructures militaires, ce qui sera bénéfique à chacun d'entre nous."
AFG_prepare_for_operation_countenance_desc: "Les membres du Commonwealth se tiennent prêts à intervenir dans [PER.GetLeLaLNP] [PER.GetName] voisin[PER.GetXENP] pour s'emparer du pétrole avant nos ennemis. Nous devons faire en sorte de les soutenir sur le plan logistique et de faire notre part dans l'opération à venir."
AFG_repeal_the_durand_line_desc: "Nous avons prouvé aux membres du Commonwealth que nous étions un ami digne de confiance dans la région. C'est peut-être le moment opportun pour renégocier la ligne Durand qui nous a été cruellement imposée il y a tant d'années."
ARG_appease_the_commonwealth: "Apaiser les membres du Commonwealth"
ARG_balancing_act_decisions_desc: "Alors que notre nouveau gouvernement se remet doucement sur pieds, nous sommes à nouveau contraints de collaborer à la fois avec les puissances de l'Axe et les puissances des membres du Commonwealth. Cette guerre est loin d'être terminée, il est donc important d'entretenir des relations habilement équilibrées avec les deux factions : privilégier l'une pourrait contrarier l'autre."
ARG_balancing_act_desc: "Les militaires contrôlent désormais le gouvernement. Nous pouvons paisiblement nous tourner vers la tempête qui gronde en Europe. Nous entretenons des relations cordiales avec les puissances des membres du Commonwealth et de l'Axe, alors nous devons veiller à ne pas nous aliéner un camp ou l'autre."
ARG_help_the_commonwealth: "Aider les membres du Commonwealth"
ARG_help_the_commonwealth_desc: "Alors que la guerre s'intensifie, les [USA.GetHabitants] se montrent de plus en plus insistants, exigeant que nous abandonnions la neutralité pour rejoindre officiellement le camp des membres du Commonwealth. Si nous acceptons, nous deviendrons officiellement un acteur de ce conflit mondial."
ARG_join_the_commonwealth: "Rejoindre le Commonwealth"
ARG_join_the_commonwealth_desc: "Le moment est venu pour nous de choisir un camp dans ce conflit. En tant que nation œuvrant à la protection de la démocratie, nous n'avons pas d'autre choix que de nous ranger du côté des membres du Commonwealth. Nous devons contribuer à protéger le monde de ceux qui cherchent à l'asservir."
ARG_maintain_neutrality: "Rejeter les membres du Commonwealth"
ARG_maintain_neutrality_desc: "Malgré la pression des puissances du Commonwealth, il n'est pas dans notre intérêt de nous impliquer dans leur guerre. Nous avons suffisamment à faire sur notre continent sans avoir besoin de nous préoccuper d'un conflit européen. Et tant pis si nous risquons ainsi un embargo [USA.GetAdjMS]."
ARG_political_events.3.desc: "Le président [ARG.GetAdjMS], [ARG.GetLeader], nous a contactés aujourd'hui pour nous demander de rejoindre le Commonwealth dans notre lutte contre l'ennemi universel. Il semblerait que nos appels à l'unité américaine face à l'adversité aient enfin été entendus."
ARG_political_events.3.t: "Les [ARG.GetHabitants]\nsouhaitent rejoindre le Commonwealth"
ARG_the_american_push_desc: "Notre volonté de maintenir de bonnes relations à la fois avec les membres du Commonwealth et l'Axe a attiré l'attention des [USA.GetHabitants]. Ils ont clairement exprimé leur mécontentement vis-à-vis de notre position neutre. Ils exigent que nous coupions les ponts avec l'Axe au plus vite."
AST_british_war_cabinet_desc: "La guerre est là. Le Royaume-Uni a formé son cabinet de guerre afin de coordonner l'effort de guerre des membres du Commonwealth. Ils nous ont invités à partager notre vision de la situation. Le Premier ministre est déjà en route pour représenter au mieux les intérêts australiens."
AST_commonwealth_after_all: "Commonwealth malgré tout"
AST_commonwealth_after_all_desc: "L'indépendance de l'Australie était un besoin vital pour notre peuple, mais la collaboration avec notre ancien suzerain ne s'arrêtera pas pour autant. Nous restons loyaux envers les [ENG.GetHabitants], comme nous l'avons toujours fait, mais désormais, nous sommes sur un pied d'égalité au sein de la faction."
AST_commonwealth_works_council: "Allied Works Council"
AST_commonwealth_works_council_desc: "Toute la production industrielle [AST.GetAdjFS] à visée militaire sera désormais contrôlée par l'Allied Works Council. Le gouvernement aura ainsi l'assurance que cette organisation centralisée produira ce dont il a besoin."
AST_domestic_industry_desc: "Il serait irresponsable de compter sur l'industrie des membres du Commonwealth en cas de guerre. Développons nos propres industries afin de nous préparer au mieux à l'inévitable."
AST_equal_training_desc: "La coopération avec les membres du Commonwealth ne s'apprend pas en un jour ; c'est une logistique périlleuse et exigeante. L'Australie se propose pour organiser des camps de formation conjointe pour les membres de la faction [ROOT.GetFactionName], afin que chaque soldat bénéficie d'une instruction rigoureuse et standardisée."
AST_mio_trait_cockatoo_docks_commonwealth_fleet_servicing: "Révision de la flotte du Commonwealth"
AUS_commonwealth_tech_sharing_group_desc: "Initiative lancée par les [AUS.GetHabitants] pour renforcer le développement technologique au sein des membres du Commonwealth."
AUS_commonwealth_tech_sharing_group_name: "Le Comité de recherche des membres du Commonwealth européens"
AUS_join_the_commonwealth: "Rejoindre le Commonwealth"
AUS_join_the_commonwealth_desc: "Nous avons toujours pensé que nous étions plus forts seuls. Toutefois, voyant la situation se détériorer autour de nous, nous sommes forcés de constater que faire cavalier seul n'est pas toujours la meilleure solution. Nous devrions chercher à rejoindre une puissante faction démocratique."
AUS_join_the_commonwealth_tt: "La probabilité d'être accepté dépend de notre caractère démocratique et de l'opinion que le meneur de la faction a à notre égard.\n\nEn cas de refus, nous pourrons créer notre propre faction."
BALTIC_commonwealth_investments_idea: "Investissements des membres du Commonwealth"
BALTIC_commonwealth_shipments: "Accroissement des livraisons du Commonwealth"
BALTIC_commonwealth_shipments_desc: "Depuis 1918, l'armée [Root.GetAdjFS] est équipée de matériel envoyé depuis [ENG.GetLeLaLNP] [ENG.GetName]. Mais nous devons faire comprendre aux membres du Commonwealth que sans davantage d'importations [Root.GetLeLaLNP] [Root.GetName] pourrai[Root.GetTEntNP] bien redevenir un fantoche [SOV.GetAdjMS]."
BALTIC_ford_motors_desc: "La société Ford a su fournir des véhicules produits en masse et peu onéreux aux [USA.GetHabitants] et à leurs partenaires du Commonwealth, dans le monde entier. Si elle établissait une usine [Root.GetAuEnANP] [Root.GetName], notre armée serait assurée de disposer de tels véhicules, et nous pourrions faire de beaux bénéfices en les exportant vers l'ouest."
BALTIC_natural_resources_desc: "[Root.GetLeLaLNPCap] [Root.GetName] [Root.GetSestSesontNP] considérablement enrichi[Root.GetXENP] par le commerce [Root.GetNaturaResource_BAL_FR] avec les Soviets, les membres du Commonwealth et les autres États baltes. Nous devrions encore investir davantage dans ce secteur en construisant de nouvelles [Root.GetExtraction_BAL] dans tout le pays."
BALTIC_renew_commonwealth_trade: "[GetBalticRenewCommonwealthTradeTitle]"
BALTIC_renew_commonwealth_trade_alt: "Investissements étrangers"
BALTIC_renew_commonwealth_trade_default: "Renouveau du commerce avec les membres du Commonwealth"
BALTIC_renew_commonwealth_trade_desc: "[GetBalticRenewCommonwealthTradeDesc]"
BALTIC_renew_commonwealth_trade_desc_commonwealth: "Depuis [Root.GetSaLeurNP] fondation, [Root.GetLeLaLNP] [Root.GetName] dépend[Root.GetXEntNP] des échanges commerciaux avec les membres du Commonwealth, et il serait insensé pour eux de nous abandonner maintenant. Nous devrions donc tout faire pour attirer leurs capitaux et ainsi assurer notre survie face aux massacres dont rêvent les [GER.GetHabitants] et les [SOV.GetHabitants]."
BALTIC_renew_commonwealth_trade_desc_default: "Depuis [Root.GetSaLeurNP] fondation, [Root.GetLeLaLNP] [Root.GetName] dépend[Root.GetXEntNP] des échanges commerciaux avec [ENG.GetLeLaLNP] [ENG.GetName] et de [ENG.GetSonLeurNP] soutien militaire. Il serait insensé pour [ENG.GetLuiElleEuxNP] de nous abandonner maintenant. Nous devrions donc tout faire pour attirer les capitaux alliés et ainsi assurer notre survie face aux massacres dont rêvent les [GER.GetHabitants] et les [SOV.GetHabitants]."
BALTIC_renew_commonwealth_trade_desc_international: "Depuis [Root.GetSaLeurNP] fondation, [Root.GetLeLaLNP] [Root.GetName] dépend[Root.GetXEntNP] des échanges commerciaux avec les autres pays, et il serait insensé pour eux de nous abandonner maintenant. Nous devrions donc tout faire pour attirer leurs capitaux et ainsi assurer notre survie face aux massacres dont rêvent les [GER.GetHabitants] et les [SOV.GetHabitants]."
BEL_join_commonwealth: "Rejoindre le Commonwealth"
BEL_join_commonwealth_desc: "Nous avons côtoyé les mêmes tranchées durant la Grande Guerre, et aujourd'hui nous repousserons ensemble l'envahisseur. Nous éliminerons tous ceux qui cherchent à nous nuire."
BUL_bogdan_filov_negotiations_tt: "\nBogdan Filov accroît les chances de succès lors des négociations avec l'Axe, et les réduit lors de celles avec les membres du Commonwealth."
BUL_join_the_commonwealth: "Intégrer la Grande Alliance"
BUL_join_the_commonwealth_desc: "Nous devons officialiser notre souhait d'intégrer la faction [ENG.GetFactionName] en en faisant part au gouvernement [ENG.GetAdjMS]."
CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: "Si les femmes qui travaillent dans les usines s'arrêtaient vingt minutes, les membres du Commonwealth perdraient la guerre.\n\n(Joseph Joffre, pendant la Première Guerre mondiale)"
CHI_collaborate_with_commonwealth_forces: "Collaborer avec les membres du Commonwealth"
CHI_collaborate_with_commonwealth_forces_desc: "Nous nous sommes férocement défendus contre l'offensive [JAP.GetAdjFS], et nos efforts ont payé, car nous ne nous battrons plus seuls. Fusionnons nos forces armées pour faciliter la coopération et assurer notre victoire."
CHI_collaborate_with_commonwealth_forces_tt: "Donne accès aux décisions permettant de fonder la Force X et la Force Y, créant ainsi des divisions"
CHL_a_joint_application_to_the_commonwealth: "Une demande conjointe aux membres du Commonwealth"
CHL_a_joint_application_to_the_commonwealth_desc: "L'Argentine et nous-mêmes avons toujours entretenu des relations cordiales avec les membres du Commonwealth de l'époque. Il est enfin temps de se joindre à eux pour œuvrer ensemble à un avenir meilleur."
CHL_political_events.1.desc: "[CHL.GetLeader], le dirigeant [CHL.GetAdjMS], propose de rejoindre conjointement les membres du Commonwealth, afin de garantir la protection de nos terres et nos littoraux tout en conservant nos liens avec nos voisins. Cette offre pourrait s'avérer bénéfique, d'autant plus que nous préservons ainsi la confiance entre nos deux pays."
CHL_political_events.3.desc: "\nL'infâme [ARG.GetLeader] a rejeté notre proposition plus que raisonnable d'une candidature commune auprès des membres du Commonwealth. Son pays va devoir assumer ses actes. De toute façon, nous sommes plus forts dans la solitude, nous n'avons jamais eu besoin d'eux..."
CZE_bonus_research_slot_2_desc: "Les partages de connaissances avec nos partenaires du Commonwealth nous ont apporté de tels bénéfices qu'il nous a été proposé d'en faire une institution permanente."
CZE_commonwealth_more_likely_to_defend_us_2_tt: "§YLes Commonwealth seront bien plus susceptibles de nous soutenir contre l'expansionnisme allemand envers les Sudètes.§!"
CZE_commonwealth_more_likely_to_defend_us_3_tt: "§YLes Commonwealth seront un peu plus susceptibles de nous soutenir contre l'expansionnisme allemand envers les Sudètes.§!"
CZE_commonwealth_more_likely_to_defend_us_tt: "§YLes Commonwealth seront plus susceptibles de nous soutenir contre l'expansionnisme allemand envers les Sudètes.§!"
CZE_cooperate_with_the_commonwealth: "Coopérer avec les membres du Commonwealth"
CZE_cooperate_with_the_commonwealth_desc: "La stabilité regagne peu à peu la région. C'est le moment idéal pour renouer avec nos alliés de l'époque."
CZE_supply_fighters_for_commonwealth: "Fournir des chasseurs aux alliés"
CZE_supply_fighters_for_commonwealth_desc: "Les [FRA.GetHabitants] et les [ENG.GetHabitants] craignent que les avions [GER.GetAdjMP] viennent à bout de leurs défenses en un clin d'œil et ravagent leurs agglomérations rapidement. Venons renforcer leur force aérienne avec quelques appareils bien pensés pour chasser leurs soucis et conserver leur ciel dénué de tout avion [GER.GetAdjMS]."
Commonwealth: "Commonwealth"
DOD_yugoslavia.35.desc: "Au cours d'une récente entrevue au Berghof, [GER.GetLeader] et [YUG.GetLeader] ont discuté de la situation en Europe, et du rôle que nous avons à y jouer. [GER.GetLeader] insiste sur le fait que la Yougoslavie ne peut éviter de choisir son camp dans la lutte à mort qui s'annonce - et que l'Allemagne ne peut en aucun cas tolérer un pays non-aligné à ses frontières.\n\nIl a conclu en disant qu'il serait presque préférable que la Yougoslavie choisisse le camp des membres du Commonwealth, car cela clarifierait grandement la situation."
DOD_yugoslavia.46.desc: "Il semble que la pression mise sur la Yougoslavie n'a pas eu les résultats escomptés. Plutôt que de mettre fin à ses relations commerciales avec l'Allemagne ou de déclarer son soutien à la cause des membres du Commonwealth, le gouvernement de [YUG.GetLeader] refuse de céder et s'accroche à la neutralité. Ces derniers temps, le MI6 a reçu des comptes-rendus selon lesquels le gouvernement yougoslave considère la possibilité d'accorder à l'Allemagne le droit de déplacer des troupes sur son territoire."
EST_beyond_the_baltic_desc: "Si certains persistent à penser que l'Entente baltique peut suffire à protéger [Root.GetLeLaFNP] petit[Root.GetXENP] [Root.GetName] face à une invasion, nous savons tous qu'il n'en est rien. Les membres du Commonwealth nous ont aidés en 1918, dans notre lutte pour l'autodétermination ; peut-être n'est-il pas complètement insensé de penser qu'ils pourraient venir une fois encore à notre aide ?"
EST_join_the_commonwealth: "Intégrer la Grande Alliance"
EST_join_the_commonwealth_desc: "Les membres du Commonwealth se sont montrés de fidèles soutiens pour le maintien de l'indépendance [Root.GetAdjFS]. Tout ce qu'il reste à faire désormais est d'officialiser cette amitié par l'entrée [Root.GetDuDelaDelNP] [Root.GetName] au sein de la Grande Alliance."
FIN_join_the_commonwealth: "Rejoindre la faction [GetCommonwealthFactionForFinland]"
FIN_join_the_commonwealth_desc: "La neutralité est un concept de moins en moins viable, car elle n'offre guère d'autre recours que l'inféodation envers les grandes puissances. Même si c'est évidemment risqué étant donné notre situation géopolitique, rejoindre le Commonwealth pourrait au contraire garantir la préservation de notre souveraineté sur le long terme."
FIN_military_aid_desc: "Les membres du Commonwealth disposent de très nombreuses compagnies produisant de l'armement. Nous aurions tout intérêt à nous tourner vers elles pour moderniser rapidement nos forces armées."
FRA_go_with_britain_reject: "A refusé l'entrée de la France parmi les membres du Commonwealth"
FRA_indochina_intervention.1.desc: "Les forces d'assaut du Commonwealth ont pris le contrôle de plusieurs grandes villes d'Indochine, contraignant le gouverneur général à demander un cessez-le-feu. Les défenseurs étaient dispersés et mal coordonnés, rendant toute résistance vaine. Leurs dernières unités se sont rendues et attendent désormais leur rapatriement."
FRA_syria_intervention.1.desc: "\nAu cours d'une cérémonie sobre organisée à Damas, le commandant des forces vichystes a officiellement capitulé et reconnu l'autorité des membres du Commonwealth sur la Syrie et le Liban. Les combats ont pris fin dans toute la région, et les unités vichystes ont déjà rendu leurs armes. Très peu de leurs hommes ont émis le souhait de rejoindre les Forces françaises libres, la plupart préférant être rapatriés en métropole."
FRA_syria_intervention.2.desc: "Après des combats acharnés ayant cloué l'avance des membres du Commonwealth sur plusieurs points stratégiques, le commandant de nos forces sur place a annoncé la fin des opérations. Les Forces françaises libres se sont quasi toutes retirées, permettant aux vichystes de consolider leurs positions sans continuer plus loin la poursuite."
FRA_syria_intervention.3.desc: "L'avancée des membres du Commonwealth en Syrie et au Liban a été stoppée, et les forces vichystes sont parvenues à consolider leurs positions sur le front. En dépit de plusieurs attaques bien coordonnées, les forces alliées ont été incapables de les en déloger. Les deux camps se sont accordés sur un cessez-le-feu, mais Vichy tient toujours l'essentiel de la région."
FRLOC_Commonwealth: "Intégrer le Commonwealth"
GER_case_anton_category_desc: "L'intention derrière la création de la France de Vichy était de conserver les colonies et la flotte françaises à l'abri des membres du Commonwealth. Mais rien ne nous empêche de revenir sur notre décision. Nous avons établi un plan pour intégrer l'ensemble du pays, tout en prenant de vitesse la flotte française dans sa base, à Toulon."
GER_claim_old_colonies_in_the_east_desc: "Le traité de Versailles nous a dépouillés de nos colonies pour les distribuer aux nations du Commonwealth. Notre peuple a clairement fait savoir qu'il considérait ce traité illégal. Si nous voulons établir de bonnes relations diplomatiques à l'est, nous devons envisager de récupérer nos colonies."
GER_destroyer_3_desc: "La classe de destroyers Zerstörer 1936A (baptisée « Narvik » par les membres du Commonwealth) fut conçue pour accueillir les nouveaux canons de 150 mm. Ils étaient armés de trois canons individuels à la poupe et d'un canon jumelé à la proue (au lieu du canon individuel prévu au départ). Quatre des huit navires de cette classe furent redessinés pour intégrer des tourelles jumelées. Un deuxième ensemble de sept destroyers légèrement modifiés fut produit pour accueillir des canons jumelés à la proue."
GER_heavy_tank_equipment_3_desc: "Surnommé Königstiger (« tigre royal ») par les Allemands et King Tiger par les membres du Commonwealth, sa conception restait celle du Tiger I, encore renforcée. Il alliait l'épais blindage du Tiger I, incliné comme celui du char moyen Panther. Avec ses 70 tonnes, il était protégé par un blindage frontal de 100 à 180 mm et armé d'un canon long Kampfwagenkanone 43 L/71 de 8,8 cm."
GER_second_ljubljana_award_desc: "Maintenant que la question yougoslave a été réglée, il est de temps de nous occuper de la Grèce. Les membres du Commonwealth l'ont injustement favorisée, et le moment vient de voir qui sont nos véritables amis."
GUAY_no_second_american_colonization_desc: "Notre continent oscille entre l'Axe et les membres du Commonwealth, tandis que nos voisins n'ont jamais rien connu d'autre que le joug impérialiste. L'Amérique du Sud mérite un meilleur avenir, un avenir où les entraves des grandes puissances ne sont plus. Nous avons le droit de façonner notre propre destin sans la lourdeur de l'héritage de la colonisation. Nous sommes prêts à écarter tous ceux qui s'y opposeraient, par la force s'il le faut."
HOL_commonwealth_research_desc: "Délais de recherche réduits pour les technologies déjà découvertes par d'autres pays du Commonwealth."
HOL_commonwealth_research_name: "Recherche technologique du Commonwealth"
HOL_commonwealth_technological_developments: "Avancées technologiques du Commonwealth"
HOL_commonwealth_technological_developments_desc: "La victoire réside avant tout dans la supériorité technologique. De manière à pouvoir nous aussi en profiter, nous devons donc assumer notre part en ce domaine en prenant en charge une partie des nombreuses ressources nécessaires à la recherche des partenaires du Commonwealth."
HOL_request_commonwealth_favors: "Demander des faveurs à nos partenaires du Commonwealth"
HOL_request_commonwealth_favors_desc: "Nous ne sommes certes qu'une puissance de second ordre, mais nous avons prouvé notre résolution à gagner la guerre. Pourtant, pour y parvenir, nous avons besoin d'aide – d'autant qu'il paraît évident que notre contribution nous a bien mérité quelques faveurs..."
HOL_request_commonwealth_favors_tt: "Ces décisions permettent d'obtenir de nos alliés des §Yusines hors-carte§!, des §Yréserves§!, du §Ymatériel§! et d'autres choses encore.\n"
HOL_zandery_military_airport_desc: "Du fait que la bauxite du Surinam et le pétrole de Curaçao jouent un rôle crucial dans la machine de guerre du Commonwealth, les Américains ont proposé de contribuer à en défendre l'approvisionnement en établissant une station radar à Curaçao et un aéroport à Zanderij, au Surinam. Une fois terminé, celui-ci serait le plus grand terrain d'aviation de toute l'Amérique du Sud."
HUN_join_commonwealth: "Intégrer la Grande Alliance"
HUN_join_commonwealth_desc: "L'avenir de la Hongrie et de ses valeurs démocratiques réside dans l'alliance avec les démocraties occidentales. En tant que membre de cette alliance, nous pourrions appuyer leurs forces et compter nous-mêmes sur leur soutien."
INS_pledge_to_commonwealth: "S'engager auprès des membres du Commonwealth"
INS_pledge_to_commonwealth_desc: "Le conflit mondial nous place sous la menace grandissante d'une invasion. Nous n'avons pas toujours été d'accord avec les membres du Commonwealth, mais en tant que nation démocratique du Pacifique, nous pourrions peut-être tenter de nous ranger dans leur camp."
IRQ_axis_training_desc: "$IRQ_commonwealth_training_desc$"
IRQ_commonwealth_training: "Entraînement des membres du Commonwealth"
IRQ_commonwealth_training_desc: "Nos alliés sont prêts à nous faire part de leur expertise militaire récemment obtenue face à nos ennemis. C'est une aide bienvenue, car nous comptons déployer nos troupes au front dans les meilleures conditions possible."
IRQ_generic_attack_bonus: "Entraînement des membres du Commonwealth"
IRQ_political_events.60.desc: "\nCédant face aux pressions des membres du Commonwealth, les usurpateurs [FROM.GetDuDelaDelNP] [FROM.GetNonIdeologyName] nous proposent de signer la paix : cette offre inclut la restauration de notre régent et de notre autorité, en échange d'une fin immédiate des hostilités et de la garantie de préserver leur intégrité territoriale. Ce revirement est une véritable infortune pour le Carré d'Or et ses ambitions. Leurs partisans risquent de s'indigner."
IRQ_political_events.62.desc: "\n[FROM.GetLeLaLNPCap] [FROM.GetName] [FROM.GetAOntNP] refusé notre traité de paix qui exigeait une soumission totale à la nouvelle autorité. Sans paix signée, les conflits reprennent, nous opposant directement à la puissance redoutable des membres du Commonwealth. Les prochains mois seront difficiles, mais nous nous battrons jusqu'au bout pour notre indépendance."
IRQ_support_the_commonwealth_war_effort: "Soutenir l'effort de guerre des membres du Commonwealth"
IRQ_support_the_commonwealth_war_effort_desc: "Que notre peuple l'accepte ou non, l'avenir du pays est assuré par les membres du Commonwealth. Prouvons notre dévouement à leur cause en nous faisant remarquer sur la nouvelle scène internationale."
LAT_join_the_commonwealth: "$EST_join_the_commonwealth$"
LAT_join_the_commonwealth_desc: "$EST_join_the_commonwealth_desc$"
LIT_join_the_commonwealth: "$EST_join_the_commonwealth$"
LIT_join_the_commonwealth_desc: "$EST_join_the_commonwealth_desc$"
NOR_commonwealth_democratic_deploy_prep_decisions_category: "Déploiement des\ndispositifs de guerre"
NOR_commonwealth_democratic_deploy_prep_decisions_category_desc: "\nComme prévu, la guerre est à nos portes, mais pas d'inquiétude. Ces dernières années, nous nous sommes entraînés à tous types de scénarios hostiles pour produire une réponse [Root.GetAdjFS]. Montrons-leur de quoi nous sommes capables.\n\nPréparation du pays : [?NOR.NOR_country_preparedness]/30"
NOR_commonwealth_democratic_preparation_decisions_category: "Préparer le pays à la guerre"
NOR_commonwealth_democratic_preparation_decisions_category_desc: "Le gouvernement est convaincu que nos ennemis peuvent frapper à tout moment. Nous devons faire preuve de résolution et armer les [NOR.GetHabitants] pour empêcher l'invasion prochaine – même si cela implique des attaques préventives. Rallions au plus vite la population pour l'emporter au plus vite dans le conflit à venir.\n\nPréparation du pays : §Y[?NOR.NOR_country_preparedness]§!/§Y30§!"
NOR_join_the_commonwealth: "Rejoindre le Commonwealth"
NOR_join_the_commonwealth_desc: "Si jamais le pire devait survenir, mieux vaut disposer d'alliés puissants et dignes de confiance, en mesure d'éviter que notre liberté ne devienne assujettissement. [FRA.GetHabitants] et [ENG.GetHabitants] ont emporté la guerre contre l'Allemagne, et pourraient sans doute le faire à nouveau."
NOR_unlocking_prep_commonwealth_dem_TT: "Donne accès aux £decision_icon_small£décisions §Y$NOR_commonwealth_democratic_preparation_decisions_category$§!, qui permettent d'utiliser les §Yconvois§! et le §Ypoids politique§! pour accroître la §Gpréparation du pays§! et de l'État pour la guerre."
NOR_unlocking_prep_deploy_commonwealth_dem_TT: "Donne accès aux £decision_icon_small£décisions permettant d'user de la §Ypréparation nationale§! afin de renforcer les forces armées [Root.GetAdjFP] en cas de conflit :\n"
NZL_support_commonwealth_with_meat: "Utiliser l'industrie de la viande"
NZL_support_commonwealth_with_meat_desc: "Nos alliés dans le Pacifique repoussent souvent les limites de leurs lignes de ravitaillement. Afin de réduire ce phénomène et d'assurer l'approvisionnement des troupes, nous allons commencer à leur fournir de la viande."
NZL_support_commonwealth_with_meat_tt: "Chaque allié va bénéficier de §G1§! §Yusine civile hors carte§!"
PAR_join_the_cominterm_desc: "Ni l'Axe ni les membres du Commonwealth ne présentent une alternative conforme à notre idéologie : seuls les [SOV.GetHabitants] proposent une solution supérieure aux deux autres."
PAR_join_the_commonwealth: "Intégrer le Commonwealth"
PAR_join_the_commonwealth_desc: "[USA.GetLeLaLNPCap] [USA.GetName] nous pouss[USA.GetEEntNP] à rejoindre le Commonwealth ; quoi que nous décidions, nous provoquerons à coup sûr des embargos conséquents."
PER_request_membership_commonwealth: "Rejoindre le Commonwealth"
PER_request_membership_commonwealth_desc: "À l'heure où le monde est de plus en plus hostile, nous devons choisir notre camp. Nos relations avec les puissances occidentales sont au beau fixe, alors une alliance nous semble tout indiquée. Ensemble, nous parviendrons à repousser le fascisme."
POL_ROM_join_commonwealth: "Intégrer la Grande Alliance"
POL_ROM_join_commonwealth_desc: "Maintenant que les couronnes [POL.GetAdjFS] et [ROM.GetAdjFS] sont posées sur le même front, nous devons réorienter nos priorités diplomatiques et nous rapprocher de nos alliés occidentaux."
POL_baltic_security_desc: "Si nous nous sommes nous-mêmes appuyés sur le soutien des Occidentaux, les concessions permanentes qu'ils font aux [GER.GetHabitants] n'incitent pas à penser que les membres du Commonwealth nous défendraient en cas d'invasion. En assurant la protection de l'Europe de l'Est nous-mêmes, alors peut-être pourrons-nous maintenir la paix dans la région."
POL_habsburg_events.201.a: "Peut-être les membres du Commonwealth\nseront-ils plus fiables..."
POL_join_commonwealth: "Rejoindre le Commonwealth"
POL_join_commonwealth_desc: "L'avenir [POL.GetDuDelaDelNP] [POL.GetName] repose sur nos anciens alliés occidentaux. Si nous sommes déjà proches de la Grande Alliance, y entrer de manière officielle permettrait d'affirmer notre attachement à l'Ouest et, espérons-le, celui de l'Ouest à notre égard."
POL_pro_commonwealth_government: "Gouvernement pro-Commonwealth"
POL_pro_commonwealth_government_desc: "De nombreux membres du Sejm sont déjà ouvertement en faveur de la poursuite des relations avec l'Occident. En permettant à ces hommes d'accéder aux plus hauts rangs au sein du gouvernement, nous donnerions ainsi des gages de bonne volonté aux membres du Commonwealth."
POR_iberian_summit_pro_commonwealth: "Proposer d'intégrer la faction [ENG.GetFactionName]"
POR_iberian_summit_pro_commonwealth_desc: "Nous devons nous ranger dans le parti [ENG.GetAdjMS] et faire face à quiconque menacerait notre liberté et chercherait à nous imposer sa domination.\n   Envoyons donc un message aux [GetIberianSummitReceiverName] pour les presser de discuter avec [ENG.GetLeLaLNP] [ENG.GetName] d'une entrée commune au sein de la faction [ENG.GetFactionName]."
POR_join_the_commonwealth: "Entrer dans la Grande Alliance"
POR_join_the_commonwealth_desc: "L'heure est venue de suivre la route tracée par les grandes démocraties européennes en participant à leur côté à leurs luttes. Ensemble, nous pourrons vaincre n'importe quel ennemi qui s'opposerait à nous !"
PRC_sino_commonwealth_pact_of_non_aggression: "Pacte de non-agression sino-Commonwealth"
PRC_sino_commonwealth_pact_of_non_aggression_accept_tt: "Cette nation va signer un §Ypacte de non-agression§! avec §Y[ROOT.GetLeLaLNP] [ROOT.GetName]§!"
PRC_sino_commonwealth_pact_of_non_aggression_desc: "La dernière chose dont nous avons besoin pendant le retrait des puissances étrangères de Chine, c'est bien de l'intervention intrusive des autres grandes puissances."
RAJ_cripps_mission_desc: "En dépit de la montée de la ferveur nationaliste réclamant l'indépendance, [RAJ.GetLeLaLNP] [RAJ.GetName] doi[RAJ.GetTVentNP] rester fidèle[RAJ.GetXSNP] à la cause des membres du Commonwealth et [ENG.GetDuDelaDelNP] [ENG.GetName]. Sir Stafford Cripps est un négociateur adroit, capable d'assurer aux leaders nationalistes que leurs exigences seront respectées."
RAJ_indian_national_army_desc: "Une Armée nationale indienne, distincte des forces contrôlées par les [ENG.GetHabitants], a été mise sur pied. Les régions débarrassées de l'ingérence [ENG.GetAdjFS] nous offrent la possibilité de l'y constituer pour faire face aux membres du Commonwealth et ainsi amoindrir les effectifs indiens du Raj."
RAJ_pledge_for_the_commonwealth: "Recherche d'alliés"
RAJ_pledge_for_the_commonwealth_desc: "Avec l'essor du fascisme et du communisme dans le monde, l'Inde ne peut rester isolée. Les [ENG.GetHabitants] ne sont peut-être pas nos amis, mais il est clair que les autres sont nos ennemis."
RAJ_the_ledo_road_desc: "Traversant un terrain accidenté, la route de Ledo constitue un itinéraire de ravitaillement essentiel reliant l'Inde aux forces du Commonwealth de Chine. Prolonger et sécuriser cette voie nous permettra de garantir les arrivées de troupes, de ressources et d'équipements nécessaires pour inverser le cours des choses en Asie du Sud-Est."
ROM_appoint_commonwealth_friendly_government: "Gouvernement favorable aux membres du Commonwealth"
ROM_appoint_commonwealth_friendly_government_desc: "L'avenir de la Roumanie dépend du maintien des bonnes relations avec nos alliés occidentaux, la France et ses alliés. Mieux vaut donc nommer un gouvernement qui perpétuera ces liens."
ROM_appoint_commonwealth_friendly_government_tooltip: "Retire les esprits nationaux §Y$ROM_iron_guard$§!, §Y$ROM_national_christian_party_in_power$§! et §Y$ROM_securitate$§!.\n"
ROM_change_sides_to_commonwealth: "Intégrer la Grande Alliance"
ROM_change_sides_to_commonwealth_desc: "Les changements au gouvernement facilitent le changement d'allégeance dans la guerre. En rejoignant les membres du Commonwealth, nos actuels « frères d'armes » dans le conflit mondial seront plongés dans la plus grande confusion, et les balles [Root.GetAdjFP] auront de nouvelles cibles."
ROM_join_commonwealth: "Intégrer la Grande Alliance"
ROM_join_commonwealth_desc: "Une garantie ne peut suffire. Le moment est venu de déclarer notre appartenance pleine et entière aux démocraties occidentales, et de nous tenir à leurs côtés pour défendre la liberté."
ROM_joint_commonwealth_staff_college: "École militaire des membres du Commonwealth"
ROM_joint_commonwealth_staff_college_desc: "Au vu de nos intérêts communs, nous devrions coopérer avec les puissances occidentales pour améliorer notre matériel et nos tactiques militaires."
ROM_military_modernization_desc: "Même si nous disposons du soutien des pays occidentaux, nous devons veiller à moderniser notre armée, de manière à ce que les membres du Commonwealth aient le temps de venir à notre secours avant que tout soit perdu."
RULE_ALT_FASCIST_GRANDI_ITA_AI_DESC: "L'I.A. italienne va tenter de chasser Mussolini du pouvoir pour installer à sa place Dino Grandi et chercher à se rapprocher des membres du Commonwealth."
RULE_DEMOCRATIC_ARG_AI_DESC: "L'IA tentera d'imposer la démocratie dans son pays et rejoindra les membres du Commonwealth pour protéger la démocratie et la liberté en Amérique du Sud."
RULE_HISTORICAL_BRA_AI_DESC: "Vargas tentera de conserver le pouvoir en éliminant soigneusement l'opposition politique du pays avant de rejoindre le Commonwealth et de collaborer avec les États-Unis."
RULE_HISTORICAL_NOR_AI_DESC: "La Norvège va essayer de conserver sa démocratie tout en résistant à l'invasion allemande. Si son gouvernement en vient à l'exil, elle poursuivra la lutte aux côtés des membres du Commonwealth."
RULE_HISTORICAL_SWE_AI_DESC: "L'I.A. suédoise va tenter de renforcer son armée tout en préservant sa neutralité et sa démocratie. Elle va soigneusement éviter d'être impliquée dans le moindre conflit avec l'Axe ou le Komintern, mais pourrait offrir un soutien limité aux membres du Commonwealth lors de la guerre."
RULE_HISTORICAL_SWI_AI_DESC: "L'I.A. suisse va rester neutre, tout en renforçant ses milices et défenses afin de parer à toute attaque. Elle soutiendra les membres du Commonwealth pour accélérer la fin de la guerre."
RULE_OPTION_ALTERNATE_KEMALIST_AI_DESC: "La Turquie va élire Fevzi Çakmak président pour qu'il poursuive sur la lancée d'Atatürk, et tenter de rester neutre aussi longtemps que possible avant de tenter de rejoindre soit le camp de l'Axe, soit celui des membres du Commonwealth."
RULE_OPTION_AUS_DEMOCRATIC_COMMONWEALTH_AI: "Démocrate autrichien (Commonwealth)"
RULE_OPTION_AUS_DEMOCRATIC_COMMONWEALTH_AI_DESC: "L'I.A. va tenter d'intégrer le Commonwealth en restaurant la démocratie en Autriche."
RULE_OPTION_DEMOCRATIC_AFG_AI_DESC: "L'I.A. afghane poussera le roi Zahir Shah à évincer ses oncles avant de mettre en place des réformes radicales visant à instaurer la démocratie en Afghanistan, avant de rejoindre le Commonwealth."
RULE_OPTION_DEMOCRATIC_ENG_AI_DESC: "L'I.A. britannique va tenter de protéger la Pologne et de diriger les membres du Commonwealth dans la guerre défensive contre l'Allemagne en suivant le chemin approprié dans l'arbre des priorités."
RULE_OPTION_DEMOCRATIC_HISTORICAL_HOL_AI_DESC: "L'I.A. néerlandaise va tenter d'intégrer le Commonwealth une fois envahie mais sans tenter de transférer son gouvernement aux Indes orientales en suivant le chemin approprié dans l'arbre des priorités."
RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC: "Le parti démocratique bulgare va tenter d'intégrer le Commonwealth en cherchant à chasser le tsar Boris du pouvoir pour former un conseil de régence favorable aux membres du Commonwealth."
RULE_OPTION_DEMOCRATIC_POL_AI_DESC: "L'I.A. polonaise va tenter de restaurer la démocratie et d'intégrer le Commonwealth."
RULE_OPTION_GOE_INDIA_UNITED_RAJ_AI_DESC: "L'I.A. indienne va tenter d'obtenir son indépendance, préserver la démocratie et rejoindre le Commonwealth. Elle évitera à tout prix la division et conservera son pays."
RULE_OPTION_HISTORICAL_AFG_AI_DESC: "L'I.A. afghane essaiera de rester neutre tout au long de la période de jeu tout en s'efforçant d'obtenir des concessions économiques de la part des puissances de l'Axe, des membres du Commonwealth et du Komintern."
RULE_OPTION_HISTORICAL_TUR_AI_DESC: "Dirigée par İsmet İnönü, la Turquie va chercher à rester neutre aussi longtemps que possible avant de tenter de rejoindre le camp des membres du Commonwealth."
RULE_OPTION_MONARCHIST_GRE_AI_DESC: "La Grèce va devenir une monarchie absolue et chercher à intégrer le Commonwealth."
RULE_OPTION_SWE_COMMUNISM_DESC: "L'I.A. suédoise va suivre la branche communiste de son arbre des priorités et s'allier soit à l'Axe, soit aux membres du Commonwealth."
RULE_OPTION_SWI_COMMONWEALTH_DEMOCRATIC: "Démocratique du Commonwealth"
RULE_OPTION_SWI_COMMONWEALTH_DEMOCRATIC_AI_DESC: "L'I.A. suisse va armer la nation et préparer la guerre, s'alignant sur les puissances démocratiques jusqu'au point de rompre sa neutralité en faveur des membres du Commonwealth."
RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE_DESC: "Adnan Menderes va assurer la transition vers une démocratie conservatrice et tenter de rejoindre le camp des membres du Commonwealth."
RULE_OPTION_TUR_DEMOCRATIC_KEMALIST_DESC: "Celâl Bayar va assurer la transition vers une démocratie kémaliste et tentera de rejoindre le camp des membres du Commonwealth."
SIA_broadcast_weather_reports_to_the_commonwealth: "Transmettre des bulletins météo aux alliés"
SIA_broadcast_weather_reports_to_the_commonwealth_desc: "Les cieux et les mers de la région sont autant régis par les conditions météorologiques que par les armées et les flottes. Grâce à [ROOT.GetSesLeursNP] rapports fiables, [ROOT.GetLeLaLNP] [ROOT.GetName] pourr[ROOT.GetAOntNP] aider les membres du Commonwealth dans leur planification, protéger leurs opérations de toute mauvaise surprise, et faire de notre pays un du Commonwealth discret mais précieux dans cette guerre."
SIA_commonwealth_integration: "Intégration des membres du Commonwealth"
SIA_commonwealth_integration_desc: "Nos forces doivent apprendre à combattre aux côtés des membres du Commonwealth. Les structures de commandement, les communications, les procédures de ravitaillement, et les normes concernant le matériel doivent être harmonisées pour que le Siam ne soit pas qu'un simple allié symbolique."
SIA_contact_the_south_east_asia_command_desc: "Pour que la résistance ne se résume pas à des actes de bravoure, elle doit s'inscrire dans une stratégie plus large. En établissant le contact avec le commandement des membres du Commonwealth en Asie du Sud-Est, les patriotes [ROOT.GetDuDelaDelNP] [ROOT.GetName] trouveront du soutien, des ravitaillements et une place dans la lutte mondiale."
SIA_join_the_commonwealth: "Rejoindre le Commonwealth"
SIA_join_the_commonwealth_desc: "En ces temps de guerre, [ROOT.GetLeLaLNP] [ROOT.GetName] ne peu[ROOT.GetTVentNP] pas se contenter de rester dans [ROOT.GetSonLeurNP] coin. Les membres du Commonwealth offrent des armes, une reconnaissance, et une place parmi les nations résistantes. En nous joignant à eux, nous lions la survie du Siam à la lutte pour un monde plus libre."
SIA_prepare_for_a_pacific_war_desc: "Les empires ont les yeux rivés sur le Pacifique. Les ambitions du Japon, les colonies d'Europe, et la stratégie des membres du Commonwealth annoncent une tempête imminente. Le Siam doit se tenir prêt avant que les premiers coups de feu n'éclatent sur nos côtes."
SIA_prepare_to_drop_desc: "Quand viendra l'heure de la libération, les membres du Commonwealth voudront peut-être arriver par le ciel. Par conséquent, nous devons apprendre à identifier les terrains d'atterrissage, préparer des contacts et organiser des réseaux de soutien pour accueillir et rediriger les forces aéroportées là où elles seront les plus utiles."
SIA_reverse_engineer_commonwealth_tanks: "Rétro-ingénierie des chars du Commonwealth"
SIA_reverse_engineer_commonwealth_tanks_desc: "D'autres ont déjà payé les frais de l'expérimentation. Les chars capturés et les machines importées peuvent être démontés, étudiés et imités. En s'inspirant des modèles étrangers, [ROOT.GetLeLaLNP] [ROOT.GetName] pourr[ROOT.GetAOntNP] concevoir [ROOT.GetSonLeurNP] propre corps de blindés."
SIA_singaporean_reinforcements_desc: "Les conflits en Malaisie et au-delà sont indissociables de notre propre sécurité. Les renforts provenant des forces réunies autour de Singapour pourraient consolider nos lignes, élargir notre coopération avec les membres du Commonwealth et nous rassembler autour d'un objectif commun."
SIA_thai_students_in_the_oss_desc: "Une nouvelle génération de jeunes patriotes peut être formée aux méthodes d'espionnage, de sabotage et de guerre irrégulière. En envoyant des étudiants thaïlandais de confiance dans les services de renseignement du Commonwealth, nous formerons des personnes compétentes pour la guerre secrète à venir."
SOV_approach_germany_desc: "Il n'y a aucune raison que nous ne trouvions pas d'accord avec [GER.GetLeLaLNP] [GER.GetName]. Nous ne pourrons évidemment coexister éternellement en paix, mais au moins [GER.GetIlElleNP] ne nous attaquer[GER.GetAOntNP] pas tant qu'[GER.GetIlElleNP] aur[GER.GetAOntNP] les membres du Commonwealth dans le dos. Et nous devrions [GER.GetLLesFNP] encourager à s'occuper d'eux d'abord."
SOV_seek_a_defense_pact_with_the_commonwealth: "Pacte défensif avec les membres du Commonwealth"
SOV_seek_a_defense_pact_with_the_commonwealth_desc: "Si des contacts informels ont eu lieu avec les démocraties occidentales, rien de concret et aucun engagement contraignant n'a été passé. Il est temps d'y remédier, en déclarant au monde que nous sommes tous prêts à faire front commun face à l'expansion fasciste."
SOV_seek_a_defense_pact_with_the_commonwealth_event_effects_tt: "Si [GetCollectiveSecurityTarget], chaque pays va signer un pacte de non-agression et garantir l'indépendance de l'autre partie."
SOV_seek_a_defense_pact_with_the_commonwealth_poland_tt: "[GetCollectiveSecurityTargetCaps] aussi demander à ce que [POL.GetLeLaLNP] [POL.GetFlag]§Y[POL.GetName]§! soit inclu[POL.GetXENP] dans le pacte."
SOV_seek_a_defense_pact_with_the_commonwealth_target_eng: "[ENG.GetLeLaLNP] [ENG.GetFlag]§Y[ENG.GetName]§! l'accept[ENG.GetEEntNP]"
SOV_seek_a_defense_pact_with_the_commonwealth_target_eng_caps: "[ENG.GetLeLaLNPCap] [ENG.GetFlag]§Y[ENG.GetName]§! pourrai[ENG.GetTEntNP]"
SOV_seek_a_defense_pact_with_the_commonwealth_target_fallback: "son gouvernement l'accepte"
SOV_seek_a_defense_pact_with_the_commonwealth_target_fallback_caps: "Il pourrait"
SOV_seek_a_defense_pact_with_the_commonwealth_target_fra: "[FRA.GetLeLaLNP] [FRA.GetFlag]§Y[FRA.GetName]§! l'accept[FRA.GetEEntNP]"
SOV_seek_a_defense_pact_with_the_commonwealth_target_fra_caps: "[FRA.GetLeLaLNPCap] [FRA.GetFlag]§Y[FRA.GetName]§! pourrai[FRA.GetTEntNP]"
SPA_expand_the_axis_gold_trade_desc: "Les puissances de l'Axe, confrontées au blocus des membres du Commonwealth, ont grand besoin de recourir aux échanges. En leur permettant d'acquérir des ressources naturelles provenant d'Espagne ou de pays neutres, leur or nous sera fort profitable."
SPA_join_the_commonwealth: "Intégrer la Grande Alliance"
SPA_join_the_commonwealth_desc: "Il est aisé de voir dans quel sens vont les choses. Mieux vaut intégrer le Commonwealth, accepter leur aide économique et nous assurer d'être du côté des vainqueurs lorsqu'ils finiront inévitablement par emporter la prochaine guerre."
SWE_approach_the_commonwealth: "Approcher les membres du Commonwealth"
SWE_approach_the_commonwealth_desc: "[ENG.GetLeLaLNPCap] [ENG.GetName] et [ENG.GetSesLeursNP] alliés finiront à un moment ou à un autre par l'emporter lors des conflits en Europe. Il serait donc prudent de [ENG.GetLuiLeurNP] montrer que nous n'avons aucune intention hostile à [ENG.GetSonLeurNP] égard."
SWE_commonwealth_tech_sharing_group_desc: "Un programme de coopération entre la Suède et les membres du Commonwealth visant au partage de technologies militaires."
SWE_commonwealth_tech_sharing_group_name: "Coopération technologique nordique-Commonwealth"
SWE_join_commonwealth_for_colonies: "Échanges territoriaux"
SWE_join_commonwealth_for_colonies_desc: "Avec le rapprochement opéré entre [SWE.GetLeLaLNP] [SWE.GetName] et les membres du Commonwealth, nous avons une chance inédite de retrouver nos anciennes possessions coloniales partout dans le monde en échange de notre entrée dans la Grande Alliance."
SWI_commonwealth_gold: "Or des membres du Commonwealth"
SWI_commonwealth_gold_desc: "L'agitation et les sanctions qui entourent actuellement les affaires ont rendu le commerce de l'or plus difficile. Mais grâce à notre neutralité, nous pouvons poursuivre les relations avec les autres nations démocratiques, contribuant ainsi à nous préserver du fascisme."
SWI_join_the_commonwealth: "Intégrer une alliance"
SWI_join_the_commonwealth_desc: "Les sacrifices matériels et compromis moraux exigés par le maintien de la neutralité deviennent intenables. La neutralité n'a plus sa place sur la scène politique européenne. En dépit de leurs défauts, disposer d'alliés est encore le meilleur moyen de préserver nos territoires en cette époque si agitée."
SWI_secret_pact_with_commonwealth_TT: "Si [Root.GetLeLaLNP] [Root.GetFlag]§Y[Root.GetName]§! devai[Root.GetTEntNP] se trouver en guerre, [Root.GetIlElleNP] intégrerai[Root.GetTEntNP] immédiatement la faction de ce pays."
SWI_secret_pact_with_the_commonwealth: "Pacte secret avec les membres du Commonwealth"
SWI_secret_pact_with_the_commonwealth_desc: "Le pays n'est pas prêt pour un conflit, ni même pour intégrer officiellement une faction ; mais ne pas disposer d'alliés se retournera contre nous. Pour défendre la démocratie en cas d'attaque-surprise, nous devrions rencontrer les autorités [?SWI.SWI_best_dem_ally.GetAdjective]s et conclure un accord : préparer secrètement l'entrée en guerre contre leur protection."
SWI_seek_commonwealth_trade: "Commerce avec les membres du Commonwealth"
SWI_seek_commonwealth_trade_desc: "Cernés de toutes parts par des ennemis, pour garantir notre survie nous devons veiller à préserver les liens commerciaux vitaux pour notre survie. Et, avec un peu de chance, nous pourrons peut-être même éviter de provoquer la colère des autres voisins en commerçant avec leurs rivaux."
SWI_support_commonwealth_espionage: "Soutien aux espions du Commonwealth"
SWI_support_commonwealth_espionage_desc: "Préserver officiellement notre neutralité ne doit pas nous empêcher de soutenir de manière discrète les démocraties pour abattre le fascisme en Europe. De fait, c'est notre neutralité et la proximité avec [?SWI.SWI_biggest_fascist.GetNameDef] qui fait de nous un allié vital dans la lutte internationale contre le fascisme."
TUR_bomber_schematics_desc: "En cas de guerre, il ne suffit pas de défendre notre ciel. Nous devons aussi pouvoir frapper au cœur même des territoires ennemis, pour empêcher que la guerre soit perdue d'avance. Les membres du Commonwealth sont les maîtres de l'usage du bombardier pour écraser leurs ennemis, et il y a beaucoup à apprendre d'eux."
TUR_join_the_commonwealth: "Intégrer la Grande Alliance"
TUR_join_the_commonwealth_desc: "Le monde se trouve à un moment charnière, un point de bascule où de nombreux empires sont sur le point de s'affronter pour changer à jamais le monde. Nous devons donc défendre les valeurs sur lesquelles est fondé notre pays, et combattre au nom de la liberté au côté des nations occidentales."
URG_break_diplomatic_relations_with_the_axis_desc: "Malgré notre statut de neutralité, l'Axe et ses méfaits ne peuvent plus être tolérés. Les vents de la guerre soufflent en faveur des membres du Commonwealth, et nous n'aurions rien à gagner en nous retrouvant dans le camp des perdants."
URG_join_the_commonwealth: "Rejoindre le Commonwealth"
URG_join_the_commonwealth_desc: "La pression [USA.GetAdjFS] nous fait comprendre clairement que nous ne pouvons plus rester en dehors de la guerre. Le peu que nous pouvons faire sera mis au service de la grande cause."
USA_neutrality_act_desc: "Il semble de plus en plus assuré que la guerre va éclater en Europe. Au cours de la Grande Guerre, les sociétés américaines ont vendu de grandes quantités d'armes aux membres du Commonwealth, et nombreux sont ceux qui pensent que l'entrée en guerre des États-Unis était essentiellement motivée par le désir de voir ces livraisons finalement payées. Cette fois, nous ne tirerons pas parti de la guerre pour faire des profits."
YUG_attract_commonwealth_capital: "Capitaux du Commonwealth"
YUG_attract_commonwealth_capital_desc: "Les [ENG.GetHabitants] ont raison de soutenir notre pays : nous avons longtemps été du Commonwealth, depuis avant la Grande Guerre. Attirer des investisseurs permettrait donc de les rassurer en montrant que nos liens sont indéfectibles."
YUG_commonwealth_air_combat_school: "École de combat aérien du Commonwealth"
YUG_commonwealth_air_combat_school_desc: "Nos nouveaux du Commonwealth ont une grande expérience du combat aérien. En poussant à la création d'une École de combat aérien du Commonwealth, nous pourrions nous assurer que nos pilotes profitent sans dommage des leçons précieuses apprises par nos partenaires du Commonwealth en versant leur sang."
YUG_delcared_war_on_axis_commonwealth: "A déclaré la guerre à l'Axe ou aux membres du Commonwealth tout en étant membre soit de l'Axe, soit de la Grande Alliance"
YUG_join_axis_desc: "Nombreux sont ceux qui voudraient voir [Root.GetLeLaLNP] [Root.GetName] rejoindre les puissances du Commonwealth et résister au fascisme, mais nous savons parfaitement que c'est là un rêve sans espoir, qui ne pourrait mener qu'à la guerre et au chaos. [GER.GetHabitants], [ITA.GetHabitants] et [JAP.GetHabitants] nous offrent un pacte d'assistance militaire et économique, mieux vaut en profiter au plus vite."
YUG_join_commonwealth: "Alliance royale"
YUG_join_commonwealth_desc: "Maintenant que le roi est marié, nous devons officialiser notre alliance. De la sorte, nous pourrons nous appuyer sur la puissance militaire de nos alliés en cas d'agression des pays voisins."
YUG_royal_alliance_tt: "Nous allons tenter d'intégrer la faction de notre allié matrimonial.\nAu cas où ce partenaire serait la princesse Alexandra, nous tenterons d'intégrer le Commonwealth."
baltic_commonwealth_research_desc: "Délais de recherche réduits pour les technologies déjà découvertes par les États baltes et leurs alliés."
baltic_commonwealth_research_name: "Recherche balte"
bba_news.201.b: "Encore une preuve qu'on ne peut\nfaire confiance aux membres du Commonwealth"
bba_news.201.desc: "\nMême si le gouvernement [POL.GetAdjMS] en exil s'est réfugié à Londres durant la guerre, les membres du Commonwealth ont choisi de reconnaître les communistes comme seule autorité légitime sur le pays. Des sources diplomatiques indiquent qu'un accord a été trouvé entre Commonwealth et [SOV.GetHabitants] concernant la division de l'Europe entre leurs sphères d'influence réciproques après le conflit – et, malheureusement pour les [POL.GetHabitants] à Londres, [SOV.GetLeader] a lourdement insisté pour que [POL.GetLeLaLNP] [POL.GetName] intègr[POL.GetEEntNP] la sphère [SOV.GetAdjFS].\n$tab_news$Nombreux sont ceux qui voient là une trahison, mais d'autres pensent que maintenant que les troupes [SOV.GetAdjFP] occupent le pays il n'y avait guère moyen de s'opposer à [SOV.Capital.GetCapitalVictoryPointName] sans mettre en danger la stabilité future de l'Europe."
bftb_bulgaria_democratic_international_policies.4.desc: "\nUne délégation [BUL.GetAdjFS] vient d'arriver [Root.GetAuEnANP] [Root.GetName] pour demander que [Root.GetLeader] reconnaisse la légitimité du gouvernement [BUL.GetAdjMS] sur les anciens territoires de son pays actuellement occupés par les troupes du Commonwealth et, par conséquent, accepte de [BUL.GetLuiLeurNP] rendre le contrôle administratif sur ces régions."
bftb_bulgaria_democratic_international_policies.5.desc: "\nNotre délégation envoyée [ENG.GetAuEnANP] [ENG.GetName] vient de rentrer après avoir réussi à faire entendre notre demande au gouvernement [ENG.GetAdjMS]. Celui-ci a accepté de rendre le contrôle administratif de nos anciens territoires et actuellement occupés par les troupes du Commonwealth [BUL.GetAuAlaAlNP] [BUL.GetName]."
bftb_bulgaria_democratic_international_policies.6.desc: "\nMalheureusement, la délégation envoyée [ENG.GetAuEnANP] [ENG.GetName] n'est pas parvenue à obtenir du gouvernement [ENG.GetAdjMS] le contrôle administratif sur les territoires historiques [Root.GetAdjMP] actuellement occupés par les troupes du Commonwealth."
bftb_bulgaria_tsar_boris.3.b: "Formons un gouvernement\nproche des membres du Commonwealth"
britain.25.desc: "\nLe gouvernement [ENG.GetDuDelaDelNP] [ENG.GetName], alarmé par la chute [DEN.GetDuDelaDelNP] [DEN.GetName] et de la présence de diplomates [GER.GetAdjMP] [Root.GetAuEnANP] [Root.GetName], vient de nous faire parvenir une invitation à intégrer le Commonwealth en tant que cobelligérants. Selon lui, cela est rendu indispensable par le fait que [GER.GetLeLaLNP] [GER.GetName] pourrai[GER.GetTEntNP] disposer de bases sur notre île d'où pourraient être lancées des opérations contre les convois et villes [ENG.GetAdjMP].\n\nMais les menaces des [ENG.GetHabitants] sont à peine voilées. Hormis les mentions à la sécurité nationale de leur pays, ils prétendent que tout souhait [Root.GetDuDelaDelNP] [Root.GetName] de faire valoir une « prétendue neutralité » ne saurait éclipser le fait que les citoyens [ENG.GetDuDelaDelNP] [ENG.GetName] luttent chaque jour pour abattre le fascisme, au profit aussi des [Root.GetHabitants]."
cominwealth_commonwealth_research_desc: "Délais de recherche réduits pour les technologies déjà découvertes par les membres du Kominwealth."
cominwealth_commonwealth_research_name: "Recherche du Kominwealth"
commonwealth_TITLE: "Commonwealth"
commonwealth_peace_1: "Le matin du Jour-J"
commonwealth_peace_2: "La fin des épreuves"
commonwealth_speeches_TITLE: "Discours du Commonwealth"
commonwealth_war_1: "Nous sommes des soldats"
commonwealth_war_2: "La Royal Air Force"
commonwealthfaction: "Faction des membres du Commonwealth"
elected_regency_council_pro_commonwealth: "$elected_regency_council$"
fall_gelb_desc: "Attaquer la France par notre frontière qui donne sur la ligne Maginot pourrait nous coûter très cher. Par conséquent, l'OKH s'est inspiré du plan Schlieffen pour préparer une invasion par les Pays-Bas. Si possible, isolez et détruisez les forces du Commonwealth présentes en Belgique en érigeant un rempart entre elles et le reste de la France."
gain_factories_based_on_investments_tt: "Nous allons gagner un nombre variable d'§Yusines civiles§!, dépendant du nombre de priorités adoptées dans les branches §Y$BALTIC_commonwealth_investments_idea$§! ou §Y$BALTIC_axis_investments$§! de l'arbre des priorités."
germany.1190.desc: "\nLe conflit contre [GER.GetLeLaLNP] [GER.GetName] sera bientôt terminé, aussi les [yalta_origin.GetHabitants] nous ont-ils contactés pour organiser une conférence sur l'avenir de l'Europe.\n\n[yalta_origin.Capital.GetCapitalVictoryPointName] suggère de diviser les territoires [GER.GetAdjMP] en trois États distincts, tandis que [Root.GetLeLaLNP] [Root.GetName] disposerai[Root.GetTEntNP] d'un contrôle limité sur l'Europe de l'Est. Les principales régions industrielles tomberaient sous contrôle des membres du Commonwealth, qui disposeraient aussi d'un contrôle limité sur le Sud. Cela réduirait par conséquent la puissance de l'Allemagne, mais l'influence [Root.GetAdjFS] en Europe centrale serait alors sans doute difficile à établir."
germany.43.t: "[FRA.GetLeLaLNPCap] [FRA.GetName] romp[FRA.GetTEntNP]\navec les membres du Commonwealth"
germany.44.d: "Les exigences [GER.GetDuDelaDelNP] [GER.GetName] sur les Sudètes se font de plus en plus hostiles, et [GER.GetIlElleNP] mass[GER.GetEEntNP] désormais des forces à la frontière. Une conférence se tient en ce moment même à Munich, où les dirigeants européens débattent de l'avenir [CZE.GetDuDelaDelNP] [CZE.GetName], mais nous n'y avons pas été conviés.\n\nHeureusement, les membres du Commonwealth semblent prêts à respecter leurs promesses de soutien, menaçant [GER.GetLeader] de lui déclarer la guerre à la moindre violation de notre frontière. Cela étant, mieux vaut que [CZE.GetLeLaLNP] [CZE.GetName] se prépar[CZE.GetEEntNP] dans les plus brefs délais à une possible attaque..."
greater_italy_category_desc: "L'irrédentisme italien a atteint son apogée avec la Grande Guerre et l'annexion du Sud-Tyrol et de l'Istrie mais, au-delà de cela, l'idéal d'une unification italienne a été trahi par les membres du Commonwealth. Sous l'autorité de [ITA.GetLeader], ces idées ont toutefois refait surface, et [ITA.GetLeLaLNP] [ITA.GetName] [ITA.GetEstSontNP] à [ITA.GetSonLeurNP] apogée. Viva l'Italia e gloria al Duce !"
idea_RAJ_commonwealth_equipment_support: "Soutien matériel du Commonwealth"
idea_SIA_seri_thai_contacts_desc: "Nos contacts au sein des Forces thaïlandaises libres ne nous ont pas déçus ; nous avons des combattants de chocs à nos ordres et un rapport privilégié avec les membres du Commonwealth."
invade_australia_desc: "Le moment est venu d'envahir l'Australie. Les membres du Commonwealth seront ainsi privés de leur principal bastion dans le Pacifique et le flanc sud de la sphère de coprospérité de la Grande Asie orientale sera sécurisé."
invasion_of_south_africa_desc: "Nos invincibles forces sont désormais prêtes à frapper l'Afrique du Sud. La conquête de ce pays obligera les unités navales des membres du Commonwealth à emprunter le canal de Suez pour accéder à l'océan Indien. Le décadent Empire britannique se disloque sous nos yeux."
isolate_australia_desc: "L'Australie est indispensable à l'effort de guerre des membres du Commonwealth dans le Pacifique et nous refusons qu'elle leur serve de base pour rassembler des forces contre le Japon et ses légitimes conquêtes. En nous emparant d'îles stratégiques du Pacifique du Sud-Ouest, nous isolerons l'Australie des États-Unis."
kaiser_challenge_met_desc: "Après avoir prédit que le Kaiser serait libéré par les Pays-Bas sans susciter d'intervention des membres du Commonwealth, l'Allemagne s'est retrouvée contrainte de faire marche arrière après avoir constaté que cela serait une erreur."
likes_commonwealth: "Aime les membres du Commonwealth"
mtg_britain.15_tt: "Si Édouard VIII ne renonce pas à son projet, [Root.GetLeLaLNP] [Root.GetName] ser[Root.GetAOntNP] indépendant[Root.GetXENP] et quitter[Root.GetAOntNP] les membres du Commonwealth.\n"
news.109.d: "Les forces de l'Afrikakorps allemand sont entrées au Caire, la capitale de l'Égypte. Alors que les forces du Commonwealth se repliaient dans le désert, les soldats allemands ont rejoint la capitale où ils ont été accueillis en libérateurs par de nombreux Cairotes lassés de leurs oppresseurs britanniques.\n\nLa chute du Caire constitue un revers de taille pour l'effort de guerre des membres du Commonwealth et plusieurs experts estiment que le Moyen-Orient est désormais menacé de conquête allemande."
news.132.d: "Les forces du Commonwealth sont récemment entrées dans Rome après la reddition de sa garnison et la ville est désormais sous occupation militaire. Le nouvel assaut lancé pour prendre le contrôle de la ville a globalement épargné les monuments historiques. Pour le moment et à la demande du Saint-Siège, les troupes du Commonwealth sont restées à l'écart du Vatican.\n\nLa chute de Rome est un jalon important dans la campagne italienne et beaucoup s'interrogent si elle marque la fin de la résistance organisée face aux armées du Commonwealth qui progressent sur la péninsule."
news.134.d: "Il a été confirmé que Paris, la capitale de la France, a été libérée de l'occupation allemande. Les forces du Commonwealth sont entrées dans la ville et les éléments restants de la garnison allemande se sont rendus. Sur les Champ-Élysées, les Parisiens en liesse ont accueilli triomphalement leurs libérateurs, mais des tirs de snipers allemands ont été signalés à différents endroits de la capitale.\n\nQuelque temps durant, on a craint que les Allemands n'utilisent la tactique de la terre brûlée pour laisser Paris à feu et à sang, mais les monuments de la ville semblent avoir été épargnés. Pour preuve, le drapeau tricolore français flotte désormais au-dessus de la tour Eiffel."
news.136.d: "Après plusieurs batailles rangées, les forces du Commonwealth occupent désormais Moscou, capitale [SOV.GetDuDelaDelNP] [SOV.GetName]. La ville a subi d'importants dégâts et des incendies continuent de faire rage des deux côtés de la Moskova. Malgré d'intenses bombardements, le Kremlin a été relativement épargné et choisi pour accueillir le quartier général de l'Administration de l'occupation du Commonwealth.\n$tab_news$La chute de la ville constitue un sérieux revers pour l'effort de guerre [SOV.GetAdjMS]. Bien que la plupart des cadres du pays aient visiblement été évacués avant le début des opérations, les experts militaires s'attendent à ce que [SOV.GetLeLaLNP] [SOV.GetName] s'effondr[SOV.GetEEntNP] dans un avenir proche."
news.151.d: "\nAprès les tentatives [GER.GetAdjFP] pour mettre un terme au traité de Versailles et remilitariser la Rhénanie, un ultimatum des membres du Commonwealth a contraint [GER.GetLeLaLNP] [GER.GetName] à faire machine arrière. Alors que [ENG.GetLeLaLNP] [ENG.GetName] et [FRA.GetLeLaLNP] [FRA.GetName] brandissaient la menace d'une intervention si les [GER.GetHabitants] s'obstinaient, il est très vite apparu qu'un tel niveau de résistance n'était pas prévu et que [GER.GetLeader] ne pouvait affronter les deux puissances dans une guerre totale.\n    En l'état actuel des choses, à moins que les [GER.GetHabitants] ne choisissent de provoquer un conflit, la Rhénanie restera donc une zone démilitarisée."
news.298.desc: "\nAu cours d'une déclaration publique, [HUN.GetLeader] a dénoncé le traité imposé par les puissances du Commonwealth au sortir de la Grande Guerre. Signé par les [HUN.GetHabitants] en 1920 en dépit de leurs protestations, il avait grandement réduit l'extension territoriale de la Hongrie et imposé des limitations strictes à son armée.\n\nD'ores et déjà, [HUN.GetLeader] a annoncé au cours de son discours que [HUN.GetLeLaLNP] [HUN.GetName] pourrai[HUN.GetTEntNP] très bientôt réaffirmer [HUN.GetSesLeursNP] revendications sur les territoires qui [HUN.GetLuiLeurNP] ont été pris voilà vingt ans."
operation_felix_desc: "Pour empêcher les membres du Commonwealth de poursuivre leurs opérations en Méditerranée, nous devons leur interdire l'accès au détroit de Gibraltar. Or, nous n'avons pas le soutien des Espagnols. Nous allons donc lancer une invasion à grande échelle de la péninsule Ibérique et occuper l'Espagne et le Portugal pour protéger le flanc sud-ouest de l'Allemagne."
operation_gertrude_desc: "L'occupation de la Turquie facilitera un déploiement de troupes entre l'Europe et le Moyen-Orient, et nous contrôlerons ainsi le seul accès à la mer Noire. Les Turcs ne doivent en aucun cas rejoindre le camp des membres du Commonwealth !"
operation_herkules_desc: "La base britannique de Malte est une véritable épine dans le pied puisqu'elle ne cesse de gêner nos opérations en Afrique du Nord. Tant que l'île sera aux mains des membres du Commonwealth, il nous sera impossible de contrôler la Méditerranée centrale. Nous devons la capturer."
operation_weserubung_desc: "Le minerai de fer scandinave est indispensable à l'industrie de guerre allemande, d'où la nécessité de préserver nos approvisionnements. Nous allons devancer une occupation de la Norvège par les membres du Commonwealth en lançant notre propre invasion. Pour atteindre cet objectif, nous devrons également occuper le Danemark, ce qui privera du même coup nos ennemis d'un accès à la mer Baltique."
poland.1.d: "Après avoir été contraints de céder Gdansk aux [GER.GetHabitants], nous sommes à présent pris en étau entre deux empires menaçant notre souveraineté.\n\nAyant perdu des territoires à l'ouest, incapables de nous fier aux membres du Commonwealth pour nous protéger d'une agression [GER.GetDuDelaDelNP] [GER.GetName], peut-être devrions-nous nous aligner sur les ambitions de [GER.GetCeluiCelleNP]-ci et revendiquer les anciens territoires de la République annexés par [SOV.GetLeLaLNP] [SOV.GetName] ?\n\nRester neutres ferait de toute façon de nous une proie sans défense, et nous nous sommes trop battus pour subir encore un partage [POL.GetDuDelaDelNP] [POL.GetName]."
pro_commonwealth_governor_general: "Gouverneur général pro-Commonwealth"
pro_commonwealth_governor_general_2: "Gouverneur général pro-Commonwealth"
pro_commonwealth_politician: "Politicien pro-du Commonwealth"
rhineland_challenge_met_desc: "Après avoir prédit que la Rhénanie pourrait être remilitarisée sans susciter d'intervention des membres du Commonwealth, l'Allemagne s'est retrouvée contrainte de faire machine arrière après avoir constaté que cela serait une erreur."
secure_the_indian_ocean_desc: "Nous devons prendre le contrôle de l'océan Indien pour empêcher les membres du Commonwealth de déployer leurs flottes en direction de l'Asie. Divers objectifs doivent être capturés, dont Madagascar, au large des côtes africaines. L'île pourrait nous servir de tremplin pour attaquer les convois britanniques en route pour le Moyen-Orient."
wtt_news.61.desc: "\nS'étant emparé de l'ensemble des territoires ottomans d'avant-guerre, le gouvernement [From.GetAdjMS] se présente désormais comme le successeur de l'Empire ottoman. La réintégration des conquêtes récentes a déjà débuté. Une vive propagande, dénonçant les partitions imposées par les membres du Commonwealth au sortir de la Grande Guerre et vantant les « jours de gloire de l'Empire », a été lancée par le gouvernement afin de rallier les populations nouvellement soumises aux vastes réformes et au retour aux normes impériales.\n    Parmi celles-ci, le gouvernement a lancé la restauration des idéaux de l'Empire et rebaptisé le pays « [From.GetName] »."
wuw_HUN_commonwealth_manufacturing_programs: "Programmes de fabrication des membres du Commonwealth"
wuw_HUN_commonwealth_manufacturing_programs_desc: "Notre industrie est puissante, mais pas autant que celle des grandes puissances mondiales. Proposons aux membres du Commonwealth de produire nos nouveaux avions dans leurs usines en échange de pengő sonnants et trébuchants."
wuw_HUN_commonwealth_manufacturing_programs_tt: "Notre meneur de la faction gagnera 2 §Yusines civiles hors carte§! et §Y1§! bonus de vitesse de recherche de §G50%§! pour le §YMatériel aérien§!"
wuw_HUN_join_the_commonwealth: "Rejoindre le Commonwealth"
wuw_HUN_join_the_commonwealth_desc: "L'avenir de la Hongrie et de ses valeurs démocratiques réside dans l'alliance avec les démocraties occidentales. En tant que membre de cette alliance, nous pourrions appuyer leurs forces et compter nous-mêmes sur leur soutien."
