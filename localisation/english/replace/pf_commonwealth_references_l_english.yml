l_english:
AAT_Sweden_communism__7_tt_1: "This will align us with the Commonwealth"
AAT_finland_continuation_war.13.desc: "It seems as though representatives from [FIN.GetNameDef] have approached the major democracies, attempting to wiggle their way out of the war against us by offering to join them in their war against the [GER.GetAdjective]s, essentially switching sides. If the Commonwealth were to agree to this, there would not be much we could do but complain and demand compensation, but at least it would mean a new partner in our struggle against fascism."
AAT_finland_continuation_war.13.t: "[FIN.GetName] is looking to Join the Commonwealth"
ABDA_events.5.desc: "[FROM.GetNameDef] has extended an invitation for us to join the American-British-Dutch-Australian Command. ABDACOM has already established itself as the supreme coordinating authority for Commonwealth forces in the Pacific theatre, bringing together the navies and armies of the major Commonwealth powers under one command. Membership would bring our forces into this unified structure, with access to shared intelligence, coordinated doctrine, and the full weight of Commonwealth support. We must decide."
ABDA_expand_the_command_desc: "ABDACOM has proven its worth. Now we must build on that foundation, extending membership to other Commonwealth nations in the region and deepening our research and intelligence sharing to stay ahead of the enemy."
ABDA_keep_trade_open_desc: "The rubber and oil of the [INS.GetNonIdeologyName] are critical to the Commonwealth war effort. ABDACOM must safeguard the sea lanes that carry these vital resources, protecting convoys from enemy interdiction and keeping trade flowing to our industries."
AFG_align_with_the_commonwealth: "Align With the Commonwealth"
AFG_align_with_the_commonwealth_desc: "Despite an abundance of grievances with the British, we must set them aside for now and pursue greater cooperation with the Commonwealth. As the British say, it's better to deal with the devil you know."
AFG_expel_axis_nationals_desc: "The Commonwealth accuse us of pandering to their enemies due to the number of citizens of belligerent nations being allowed to go about their activities freely in [ROOT.GetNonIdeologyName]. While there is little evidence of them doing anything detrimental to our interests, we should placate the Commonwealth by demanding these people leave for the duration of the current global conflict."
AFG_expel_commonwealth_nationals: "Expel Commonwealth Nationals"
AFG_expel_commonwealth_nationals_desc: "The Axis powers have presented us with questionable evidence that our regime is at risk of being usurped by the Commonwealth. They argue that the only way to prevent this, is to oust all citizens of the Commonwealth nations to flush out any of their spies in the country."
AFG_future_of_balochistan_desc: "Although we are collaborating with Commonwealth for the time being, we must think of the long-term politics of our region. We should therefore push for an independent Balochistan that we can influence, before it is swallowed up by a larger state."
AFG_linchpin_of_global_defense_desc: "The Commonwealth continue to see our allegiance as an asset in their geo-political posturing with our common adversaries. We should capitalize on this by securing more investment in military infrastructure that will be mutually beneficial for all of us. "
AFG_prepare_for_operation_countenance_desc: "The Commonwealth are gearing up for an intervention in neighboring [PER.GetName] to secure their oil before our enemies beat us to it. We must make logistical arrangements to support the intervention and do our part in the coming operation."
AFG_repeal_the_durand_line_desc: "We have proven ourselves a trustworthy friend in the region for the Commonwealth. Perhaps now would be a good opportunity to renegotiate the Durand Line which was cruelly forced upon us all those years ago."
ARG_appease_the_commonwealth: "Appease the Commonwealth"
ARG_balancing_act_decisions_desc: "As our new government recovers, we are once more pressed with the issue of trying to maintain relations with both the Commonwealth and Axis powers. This war seems to have no immediate end in sight, and so it is important that we balance our allegiances wisely. Favouring one is likely to upset the other."
ARG_balancing_act_desc: "With the Military now in control of the government, we can turn our eyes to the gathering storm in Europe. As the Commonwealth and Axis powers both have relations with [ARG.GetName], we have to be careful to not alienate either side."
ARG_help_the_commonwealth: "Help the Commonwealth"
ARG_help_the_commonwealth_desc: "As the war escalates even further, pressure from the [USA.GetName] grows for us to abandon neutrality and formally join the Commonwealth. If we choose to do so, then we will officially be a player within this global conflict."
ARG_join_the_commonwealth: "Join the Commonwealth"
ARG_join_the_commonwealth_desc: "The time has come for us to pick a side in this conflict. As a nation working towards protecting the sanctity of democracy, it is imperative that we reach out to the Commonwealth and secure our place within the faction. We must help protect the world from those who seek to subjugate it."
ARG_maintain_neutrality: "Reject the Commonwealth"
ARG_maintain_neutrality_desc: "Despite the pressure from the Commonwealth powers, it is not in our interest to get involved in their war. We have enough to focus on in our own continent without having to worry about a conflict in Europe. If this risks an embargo from the [USA.GetName] then so be it."
ARG_political_events.3.desc: "President [ARG.GetLeader] of [ARG.GetName] has approached us today with an application to join the Commonwealth in our fight against our enemies. It would seem that our requests for American unity in the face of such adversity have finally been listened to."
ARG_political_events.3.t: "[ARG.GetName] Offers to Join the Commonwealth"
ARG_the_american_push_desc: "Our dedication to balancing our relations between the Commonwealth and the Axis has not gone unnoticed by the [USA.GetName]. They have made it clear they are dissatisfied with our moderate views and may ask us to cut ties with the Axis once and for all."
AST_british_war_cabinet_desc: "War has broken out, and the United Kingdom has formed a War Cabinet to ensure the efficient conduct of the Commonwealth war effort. They have summoned us to share our views on the matter too, and so the Prime Minister will depart to represent Australian interests."
AST_commonwealth_after_all: "Commonwealth After All"
AST_commonwealth_after_all_desc: "Although Australian independence was a necessity, all collaboration with our old overlord shall not cease. We will remain loyal to the [ENG.GetFactionName], as we always have, but aim for greater influence within the faction."
AST_commonwealth_works_council: "Commonwealth Works Council"
AST_commonwealth_works_council_desc: "All military construction in Australia will be overseen by the Commonwealth Works Council. This centralized planning will make sure that the government gets the type of productivity it needs."
AST_mio_trait_cockatoo_docks_commonwealth_fleet_servicing: "Commonwealth Fleet Servicing"
AUS_commonwealth_tech_sharing_group_desc: "An initiative started by the [AUS.GetAdjective]s to further develop technology together within the Commonwealth."
AUS_commonwealth_tech_sharing_group_name: "The European Commonwealth Research Committee"
AUS_join_the_commonwealth: "Join the Commonwealth"
AUS_join_the_commonwealth_desc: "Traditionally we have always regarded ourselves as strongest on our own, yet, as the situation around us continues to deteriorate, we are forced to face the fact, that this might not be true. Being all alone is not always the best option. We should seek to join a strong democratic faction."
AUS_join_the_commonwealth_tt: "The likelihood of being accepted as a member depends on being democratic and your opinion with the faction leader.\n\nIf we are rejected, we will be able to start our own faction instead."
BALTIC_commonwealth_investments_idea: "Commonwealth Investments"
BALTIC_commonwealth_shipments: "Increase Commonwealth Shipments"
BALTIC_commonwealth_shipments_desc: "Since 1918, the [Root.GetNonIdeologyAdjective] army has been equipped with shipments sent to us from Great Britain and we should make efforts to make the Commonwealth understand that unless shipments are drastically increased, [Root.GetNonIdeologyName] may become subject to another Soviet puppet government."
BALTIC_ford_motors_desc: "Ford motor company have done a fine job of providing mass-produced affordable motor vehicles to the Americans and other Commonwealth nations throughout the world. If we should establish a Ford manufactory in [Root.Capital.GetName], we will be able to both provide vehicles for our own army and make a tidy profit exporting them to the West."
BALTIC_natural_resources_desc: "[Root.GetNaturaResource_BAL] has made our country rich from trade with the Soviets, the Commonwealth, and our fellow Baltic states alike and we would do well to invest more into this industry by investing in [Root.GetExtraction_BAL] across the nation!"
BALTIC_renew_commonwealth_trade: "[GetBalticRenewCommonwealthTradeTitle]"
BALTIC_renew_commonwealth_trade_alt: "Seek Foreign Investments"
BALTIC_renew_commonwealth_trade_default: "Renew Commonwealth Trade"
BALTIC_renew_commonwealth_trade_desc: "[GetBalticRenewCommonwealthTradeDesc]"
BALTIC_renew_commonwealth_trade_desc_commonwealth: "We have been reliant on the Commonwealth for trade and military support since the inception of our state and it would be foolhardy of us to abandon that now. We must attract Commonwealth investments to our nation if we are to once again survive the onslaught of the Germans and Russians encroaching on our borders."
BALTIC_renew_commonwealth_trade_desc_default: "We have been reliant on British trade and military support since the inception of our state and it would be foolhardy of us to abandon that now. We must attract allied investments to our nation if we are to once again survive the onslaught of the Germans and Russians encroaching on our borders."
BALTIC_renew_commonwealth_trade_desc_international: "We have been reliant on other nations for trade and military support since the inception of our state and it would be foolhardy of us to abandon that now. We must attract foreign investments to our nation if we are to once again survive the onslaught of the Germans and Russians encroaching on our borders."
BEL_join_commonwealth: "Join Commonwealth"
BEL_join_commonwealth_desc: "The Great War saw us stand together as allies before, and together we stood the test of invasion. Together we will stand again, against all who would do us harm."
BUL_bogdan_filov_negotiations_tt: "\nBogdan Filov increases the chance of success when negotiating with the Axis and decreases it when negotiating with the Commonwealth."
BUL_join_the_commonwealth: "Join the Commonwealth"
BUL_join_the_commonwealth_desc: "We must formalize our desire to join the [ENG.GetFactionName] by submitting an application to the [ENG.GetAdjective] government to consider [ROOT.GetNameDef]'s membership in their alliance."
CAN_the_black_devils_desc: "A special commando unit will need to be available for dangerous assignments. Cooperation with our American Commonwealth in the creation of The Devil's Brigade has been arranged."
CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: ""If the women in the factories stopped work for 20 minutes, the Commonwealth would lose the war."\n\n- French Field Marshal and Commander in Chief Joseph Joffre, WW1."
CHI_collaborate_with_commonwealth_forces: "Collaborate with Commonwealth Forces"
CHI_collaborate_with_commonwealth_forces_desc: "We have fought long and hard against the [JAP.GetAdjective] threat, but we are no longer alone. To be able to coordinate our efforts we should integrate both our armed forces further, and achieve final victory."
CHI_collaborate_with_commonwealth_forces_tt: "Unlocks Decisions to Form the X and Y Force which will create divisions."
CHL_a_joint_application_to_the_commonwealth: "A Joint Application to the Commonwealth"
CHL_a_joint_application_to_the_commonwealth_desc: "Us and Argentina have always had good enough relations with the Commonwealth of old, and it is finally time to join up with them and work together for a brighter future."
CHL_political_events.1.desc: "[CHL.GetLeader] of [CHL.GetNameDef] has proposed a mutual application for the Commonwealth, in an attempt to safeguard our waters and lands, while simultaneously not also tearing away from each-others close ally-ship, and breaking the mutual relations between our countries. It might be wise to accept their request."
CHL_political_events.3.desc: "The vile [ARG.GetLeader] has rejected our just and reasonable request for a joint application to the Commonwealth, and it is time that he realizes that which he has lost out on. We are stronger on our own anyway, and never needed them in the first place..."
CZE_bonus_research_slot_2_desc: "Commonwealth knowledge sharing has brought such large benefits that it has now been proposed as a permanent institution."
CZE_commonwealth_more_likely_to_defend_us_2_tt: "§YThe Commonwealth will be significantly more likely to back us against German expansionism regarding the Sudetenland.§!"
CZE_commonwealth_more_likely_to_defend_us_3_tt: "§YThe Commonwealth will be a tiny bit more likely to back us against German expansionism regarding the Sudetenland.§!"
CZE_commonwealth_more_likely_to_defend_us_tt: "§YThe Commonwealth will be more likely to back us against German expansionism regarding the Sudetenland.§!"
CZE_cooperate_with_the_commonwealth: "Cooperate with the Commonwealth"
CZE_cooperate_with_the_commonwealth_desc: "With greater stability in the region established, we should make an effort to restore ties with our traditional allies."
CZE_supply_fighters_for_commonwealth: "Supply Fighters to Commonwealth"
CZE_supply_fighters_for_commonwealth_desc: "The [FRA.GetAdjective] and [ENG.GetAdjective] governments are very afraid that [GER.GetAdjective] planes would quickly defeat their defenses and target their cities if a conflict starts. Strengthening their airforce may therefore make them a little more confident about their ability to halt [GER.GetAdjective] expansion without significant loss of life."
Commonwealth: "Commonwealth"
DOD_yugoslavia.35.desc: "In a recent meeting at the Berghof, [GER.GetLeader] and [YUG.GetLeader] discussed the situation in Europe, and our role in it. [GER.GetLeader] insists that Yugoslavia can not avoid taking a side in the life-or-death struggle looming in the distance. Nor could Germany tolerate an unaligned country at her borders. \n\nIt would almost be preferable, he ended, if Yugoslavia choose to side with the Commonwealth, just so everyone knew where they stood."
EST_beyond_the_baltic_desc: "Though some would insist that the Baltic Entente is enough to protect our small nation from invasion, we all truly know this to be a fallacy. The Commonwealth aided us in 1918 in our struggle for self-determination, and perhaps it would not be so foolhardy to expect them to come to our aid yet again!"
EST_join_the_commonwealth: "Join the Commonwealth"
EST_join_the_commonwealth_desc: "The Commonwealth have proven themselves to be a friend to [ROOT.GetAdjective] independence, and all that remains now is to formalize that friendship with [ROOT.GetNameDef]’s official entry into the Commonwealth faction."
FIN_join_the_commonwealth: "Join the [GetCommonwealthFactionForFinland]"
FIN_join_the_commonwealth_desc: "Neutrality is quickly becoming an antiquated policy that simply leads to vassalization at the hands of the great powers. While it is a risk given our geo-political position, joining the Commonwealth may allow us to maintain our sovereignty in the long-run."
FIN_military_aid_desc: "The Commonwealth have a vast array of arms manufacturers, we should make use of them to rapidly modernize our armed forces."
FRA_BLITZKRIEG_DESC: "The Great War still fresh in its memory, France faces a new conflict after Germany showed they have no intention to keep the peace. Strengthening border defenses and choosing Commonwealth wisely may very well be the way for France to avoid a disastrous war.\n\n France was victorious once before, this time shall be no different!"
FRA_central_africa_intervention.1.t: "Commonwealth secure Central Africa"
FRA_go_with_britain_desc: "With Russia forever changed, only France and Britain remain of the old Triple Entente. If history is doomed to repeat itself, we must ensure that these two nations, bastions of democracy and liberty in Europe, remain Commonwealth."
FRA_go_with_britain_reject: "Rejected France joining Commonwealth"
FRA_indochina_intervention.1.desc: "Commonwealth assault columns have reached several major cities in Indochina, prompting the local governor to ask for a cease-fire. With the defenders scattered and poorly coordinated, any further resistance was deemed futile. The remaining defenders have surrendered their weapons and await repatriation to Vichy France."
FRA_indochina_intervention.1.t: "Commonwealth secure Indochina"
FRA_syria_intervention.1.desc: "In a subdued ceremony in Damascus, the local commander of Vichy forces has officially surrendered the territory to the Commonwealth. Fighting has come to an end all across the region, with the surviving Vichy forces marching into captivity. Very few of the French soldiers involved have expressed any desire to join the Free French forces, with most of them preferring to be repatriated."
FRA_syria_intervention.1.t: "Commonwealth secure Syria"
FRA_syria_intervention.2.desc: "Following fierce fighting that stalled Commonwealth advances at several key points, the local Commonwealth commander has called for a halt in operations. Commonwealth forces have largely withdrawn to their starting positions as Vichy troops consolidated their positions. Vichy forces have not taken up the pursuit and seem content with holding their positions."
FRA_west_africa_intervention.1.t: "Commonwealth secure West Africa"
GER_case_anton_category_desc: "The intent behind the creation of Vichy France was always to keep the French colonies and the French fleet out of the hands of the Commonwealth. However, it is an agreement we may choose to rescind at any time. We have a plan drawn up to forcibly integrate the area, as well as making a lightning push for the French fleet's base at Toulon."
GER_claim_old_colonies_in_the_east_desc: "The Treaty of Versailles stripped us of our colonies and distributed these to the Commonwealth nations. Our people has made clear that they, much like us, think this was unlawful. As part of establishing diplomatic relations in the East we should also consider attempting to get our colonies back."
GER_destroyer_3_desc: "Zerstörer 1936A, known to the Commonwealth as Narvik Class destroyers, was designed to carry the new 150mm (5.9") guns. Designed with three single guns aft and a twin gun in the bow, they were originally fitted with a single gun in the bow. Four of the eight ships of the class were later refitted with the twin turrets. A second group of seven destroyers were built to a slightly modified design with twin guns in the bow."
GER_heavy_tank_equipment_3_desc: "Known under the informal name Königstiger but, often semi-literally translated as the King Tiger by Commonwealth soldiers, the design followed the same concept as the Tiger I, but was intended to be even more formidable. The Tiger II combined the thick armor of the Tiger I with the sloped armor used on the Panther medium tank. The tank weighed almost seventy metric tons, was protected by 100 to 180mm of armor to the front and was armed with the long barreled 8.8 cm Kampfwagenkanone 43 L/71 gun."
GER_second_ljubljana_award_desc: "With the Yugoslav question solved it is time to turn our attention to Greece. They too have been unjustly aggrandized by the Commonwealth. It is time to see who our friends really are."
GUAY_no_second_american_colonization_desc: "Our continent pendulums between the Axis and the Commonwealth and while our neighbors only see themselves as being under the yoke of others. South America deserves a better fate unfettered by the old powers, to shape our own destiny unconstrained from the legacy of colonization and if we have to trample those with a lesser vision to get there so be it."
HOL_commonwealth_research_desc: "Reduced research time for technologies researched by other Commonwealth countries."
HOL_commonwealth_research_name: "Commonwealth Technological Developments"
HOL_commonwealth_technological_developments: "Commonwealth Technological Developments"
HOL_commonwealth_technological_developments_desc: "Victory lies with technological superiority. We must lend our share to the vast resources pumped into Commonwealth R&D programs, so that we, too, may profit from them."
HOL_request_commonwealth_favors: "Request Commonwealth Favors"
HOL_request_commonwealth_favors_desc: "We may be a minor power, but we have shown our dedication to winning this war. However, to do so, we need help, and it should be expected that we have earned a few favors through our contributions..."
HOL_request_commonwealth_favors_tt: "These make it possible to obtain §YOffmap Industry§!, §YManpower§!, §YEquipment§!, and more from your allies.\n"
HOL_zandery_military_airport_desc: "Due to the importance of Surinamese bauxite and Curaçao oil to the Commonwealth war effort, the Americans have proposed to aid in their defense by establishing a radar post on Curaçao, and building an airport and infrastructure at Zandery in Suriname. Once finished, it should be the largest military airport in South America."
HUN_join_commonwealth: "Join the Commonwealth"
HUN_join_commonwealth_desc: "The future of Hungary and its democratic values lies with the major Western democracies and their alliance. As a member of this alliance, we may lend our strength to theirs, as well as count on their support ourselves."
INS_establish_nefis_desc: "We will create the Netherlands East Indies Forces Intelligence Service together with the Commonwealth, which we will station in Australia. Through this we will conduct clandestine operations to sabotage the Japanese occupying forces. Through each small victory, we move closer to our return to the homeland."
INS_pledge_to_commonwealth: "Pledge to the Commonwealth"
INS_pledge_to_commonwealth_desc: "We are at risk of being invaded as part of the growing conflict across the world. While our relations with the Commonwealth have been shaky, we have established ourselves as a Democratic power in the pacific and should align ourselves with the big democratic powers."
IRQ_axis_training_desc: "$IRQ_commonwealth_training_desc$"
IRQ_commonwealth_training: "Commonwealth Training"
IRQ_commonwealth_training_desc: "Our allies are willing to impart some of the expertise they have gained in recent years of conflict with our foes. We shall accept this aid in order to prepare our troops as well as possible for frontline duty."
IRQ_generic_attack_bonus: "Commonwealth Training"
IRQ_political_events.60.desc: "Facing mounting pressure from the Commonwealth, the usurpers in [FROM.GetNonIdeologyName] have proposed a peace settlement. They offer to restore the regent and reestablish our authority in exchange for an end to hostilities and the preservation of their territorial integrity. While this proposal acknowledges the futility of further resistance, it marks a significant reversal of the Golden Square’s ambitions and may lead to unrest among their supporters."
IRQ_political_events.62.desc: "[FROM.GetNameDefCap] has rejected our proposal for peace, insisting on complete submission without compromise. With negotiations failing, the conflict will continue, leaving us to face the full might of the Commonwealth forces. The path ahead will be fraught with challenges, but our resolve for independence remains unshaken."
IRQ_support_the_commonwealth_war_effort: "Support the Commonwealth War Effort"
IRQ_support_the_commonwealth_war_effort_desc: "Whether our people are willing to accept it or not, our future lies with the Commonwealth nations of the world. We must demonstrate our commitment to their cause and carve out a position for ourselves in the emerging world order."
LAT_join_the_commonwealth: "[Root.Get_Join_Commonwealth_Focus_Loc]"
LAT_join_the_commonwealth_desc: "[Root.Get_Join_Commonwealth_Focus_desc_Loc]"
LIT_join_the_commonwealth: "Join the Commonwealth"
LIT_join_the_commonwealth_desc: "[Root.Get_Join_Commonwealth_Focus_desc_Loc]"
NOR_commonwealth_democratic_deploy_prep_decisions_category: "Deploying Our War Preparations"
NOR_commonwealth_democratic_deploy_prep_decisions_category_desc: "Just as we expected war is finally upon us, but there is nothing to fear. For the last few years we have been focusing all our efforts in getting [ROOT.GetName] ready for whatever our enemies throw at us. Let us show them what we are made of.\n\nNational Preparedness: [?NOR.NOR_country_preparedness]/30"
NOR_commonwealth_democratic_preparation_decisions_category: "Preparing Norway for War"
NOR_commonwealth_democratic_preparation_decisions_category_desc: "This government is certain that our enemies will strike at any minute now. We must be resolute in our zeal to arm the population of [NOR.GetName] in order to prevent an invasion. Even if it means attacking preemptively.So let us rally our country, and take the power we need to decisively win against our enemies.\n\nNational Preparedness: [?NOR.NOR_country_preparedness]/30"
NOR_join_the_commonwealth: "Join the Commonwealth"
NOR_join_the_commonwealth_desc: "For when the worst finally happens, having strong and trustworthy allies will mean the difference between subjugation and freedom. [FRA.GetName] and [ENG.GetName] won the Great War against Germany, and we believe they can do it again."
NOR_unlocking_prep_commonwealth_dem_TT: "Unlocks §YPrepare State For War§! that allow using §YConvoys§! and §YPolitical Power§! to increase §GNational Preparedness§! and get the state ready for war"
NOR_unlocking_prep_deploy_commonwealth_dem_TT: "Unlocks decisions that allow using §YNational Preparedness§! to boost Norway's armed forces when War comes:\n"
NZL_support_commonwealth_with_meat: "Utilize the Meat Industry"
NZL_support_commonwealth_with_meat_desc: "Our allies in the Pacific are often stretching their supply lines to their limits. In order to reduce the strain and to keep their troops fed, we shall begin supplying them with meat."
NZL_support_commonwealth_with_meat_tt: "Every Ally will receive §G1§! §YOffmap Civilian Factory§!"
PAR_join_the_cominterm_desc: "Neither the Axis or the Commonwealth leads to any alternative that aligns with our ideology, but [SOV.GetName] is the clear alternative to the other two evils."
PAR_join_the_commonwealth: "Join The Commonwealth"
PAR_join_the_commonwealth_desc: "[USA.GetName] has been pressuring us to join the Commonwealth, and we cannot see any alternative that does not lead to significant embargoes."
PER_request_membership_commonwealth: "Request Membership Commonwealth"
PER_request_membership_commonwealth_desc: "With tensions rising across the world, it is finally time for us to pick a side. Given we have grown closer with our western friends, it makes the most sense for us to align ourselves with them. Together we can stamp out the threat of fascism worldwide."
POL_ROM_join_commonwealth: "Join the Commonwealth"
POL_ROM_join_commonwealth_desc: "With the thrones of Poland and Romania now united, we must shift our diplomatic focus back towards our allies in the West."
POL_baltic_security_desc: "Although we have relied on the West for support, the constant concessions made to the Germans makes us doubtful that the Commonwealth would defend us in the event of an invasion. Perhaps by protecting our fellows in Eastern Europe ourselves, we may be able to maintain some peace."
POL_habsburg_events.201.a: "Perhaps we should turn to the Commonwealth."
POL_join_commonwealth: "Join the Commonwealth"
POL_join_commonwealth_desc: "The future of [Root.GetNameDef] exists in the hands of our old allies in the West. Though we are already affiliated with the Commonwealth, officially joining them shall affirm our commitment to the West, and hopefully the West’s commitment to Poland in turn."
POL_pro_commonwealth_government: "Appoint a Pro-Commonwealth Government"
POL_pro_commonwealth_government_desc: "Many Sejmiks already are in favour of continuing Poland’s alignment with the West, and by promoting these representatives to higher ranks in governance, we make ourselves more openly amicable to the cause of the Commonwealth."
POR_iberian_summit_pro_commonwealth: "Proposal to Join the [ENG.GetFactionName]"
POR_iberian_summit_pro_commonwealth_desc: "We must side with the [ENG.GetAdjective] and face all those that threaten our freedom and seek to dominate us. \nWe will send a missive to [GetIberianSummitReceiverName], urging them to discuss a joint proposal requesting [ENG.GetNameDef] to admit us to the [ENG.GetFactionName]."
POR_join_the_commonwealth: "Join the Commonwealth"
POR_join_the_commonwealth_desc: "It is time to follow the lead of the major Democracies in Europe and join them in their struggles. Together we will hold against any foe!"
PRC_sino_commonwealth_pact_of_non_aggression: "Sino-Commonwealth Pact of Non-Aggression"
PRC_sino_commonwealth_pact_of_non_aggression_accept_tt: "They will sign a §YNon-Aggression Pact§! with §Y[ROOT.GetName]§!"
PRC_sino_commonwealth_pact_of_non_aggression_desc: "As we remove foreign influence from China, we must ensure that the less expansionist major powers do not get involved."
RAJ_cripps_mission_desc: "We have to keep India loyal to the Commonwealth and British cause, in spite of the rising nationalist fervor for independence. Sir Stafford Cripps is a skilled negotiator who can assure the nationalist leaders that their demands will be addressed."
RAJ_indian_national_army_desc: "An Indian National Army, distinct from British controlled forces, has been organized. We can build it in regions free from British interference and line up against the Commonwealth, sapping Indian manpower from the Raj."
RAJ_pledge_for_the_commonwealth: "Pledge For The Commonwealth"
RAJ_pledge_for_the_commonwealth_desc: "With fascism and communism rising around the world India cannot stand alone. [ENG.GetName] might not have been India's friend, but it is clear that the others are our enemy."
RAJ_the_ledo_road_desc: "Cutting through rugged terrain, the Ledo Road is a critical supply route linking India to Commonwealth forces in China. Completing and securing this lifeline ensures the flow of troops, resources, and equipment needed to turn the tide in Southeast Asia."
ROM_appoint_commonwealth_friendly_government: "Appoint Pro-Commonwealth Government"
ROM_appoint_commonwealth_friendly_government_desc: "The future of Romania hinges on good relations with our old allies in the West - France and her allies. We must appoint a government that continues these relationships."
ROM_appoint_commonwealth_friendly_government_tooltip: "Removes §YIron Guard§!, §Y$ROM_national_christian_party_in_power$§! and §YSecuritate§!\n"
ROM_change_sides_to_commonwealth: "Join the Commonwealth"
ROM_change_sides_to_commonwealth_desc: "Changes in our government have facilitated a change in our alignment in the war. By joining with the Commonwealth, our current “comrades” in this global conflict shall become confused as Romanian bullets find a new target."
ROM_join_commonwealth: "Join the Commonwealth"
ROM_join_commonwealth_desc: "A guarantee is not enough - it is time to declare for the Western democracies fully, and stand with them in defense of liberty."
ROM_joint_commonwealth_staff_college: "Joint Commonwealth Staff College"
ROM_joint_commonwealth_staff_college_desc: "In light of our shared interests, we should cooperate with the Western powers in the development of military equipment and tactics."
RULE_ALT_FASCIST_GRANDI_ITA_AI_DESC: "The Italian AI will attempt to oust Mussolini from power, and install Dino Grandi instead to seek to strengthen ties with the Commonwealth."
RULE_DEMOCRATIC_ARG_AI_DESC: "The AI will attempt to turn democratic and will join the Commonwealth to safe guard democracy and freedom in South America"
RULE_HISTORICAL_BRA_AI_DESC: "Vargas will attempt to stay in power by carefully eliminating the political opposition in Brazil before eventually joining the Commonwealth and working with the United States."
RULE_HISTORICAL_NOR_AI_DESC: "Norway will attempt to remain democratic and resist the German invasion before continuing to fight on as a government in exile, alongside the Commonwealth."
RULE_HISTORICAL_SWE_AI_DESC: "The AI will attempt to build up the Swedish military while remaining neutral and democratic. It will carefully avoid getting into conflict with the Axis and Comintern, but may offer limited support to the Commonwealth later in the war."
RULE_HISTORICAL_SWI_AI_DESC: "Switzerland will remain neutral, while building up their militias and fortifications in preparation for any attack. They will give some support to the Commonwealth towards the end of the war."
RULE_OPTION_ALTERNATE_KEMALIST_AI_DESC: "Turkey will appoint Fevzi Çakmak to follow in Mustafa Kemal Atatürk's footsteps as President, and will pursue neutrality for as long as possible before attempting to join either the Axis or the Commonwealth."
RULE_OPTION_AUS_DEMOCRATIC_COMMONWEALTH_AI: "Austrian Democratic - Commonwealth"
RULE_OPTION_AUS_DEMOCRATIC_COMMONWEALTH_AI_DESC: "The AI will attempt to join the Commonwealth by re-establishing democracy in Austria."
RULE_OPTION_DEMOCRATIC_AFG_AI_DESC: "The Afghan AI will push King Zahir Shah to oust his uncles before continuing on a path of radical reforms. This will culminate in Afghanistan becoming a democracy and joining the Commonwealth."
RULE_OPTION_DEMOCRATIC_ENG_AI_DESC: "The British AI will attempt to protect Poland and lead the Commonwealth in their defensive war against the Germans, by going down the relevant path in the national focus tree."
RULE_OPTION_DEMOCRATIC_HISTORICAL_HOL_AI_DESC: "The Dutch AI will attempt to join the Commonwealth once invaded, but not relocate their government to the East Indies, by going down the relevant path in the national focus tree."
RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC: "The Bulgarian Democratic Party will attempt to join the Commonwealth as it conspires against Tsar Boris to remove him from power and form a pro-Commonwealth regency council."
RULE_OPTION_DEMOCRATIC_POL_AI_DESC: "The Polish AI will attempt to restore democracy and join the Commonwealth."
RULE_OPTION_DEMOCRATIC_POR_AI_DESC: "Influenced by the United Kingdom, a democratic government will overthrow the authoritarian regime of Salazar and, with the help of the British, focus on developing the national industry before joining the Commonwealth."
RULE_OPTION_GOE_INDIA_UNITED_RAJ_AI_DESC: "India will endeavour to become independent, remain Democratic and join the Commonwealth, but stand united as one country and avoid Partition."
RULE_OPTION_HISTORICAL_AFG_AI_DESC: "The Afghan AI will attempt to stay neutral throughout the time period while also attempting to gain economic concessions from the Commonwealth, Comintern and Axis powers."
RULE_OPTION_HISTORICAL_TUR_AI_DESC: "Turkey will pursue neutrality for as long as possible under the leadership of İsmet İnönü, and then attempt to join the Commonwealth."
RULE_OPTION_MONARCHIST_GRE_AI_DESC: "Greece will become an absolute monarchy and seek to join the Commonwealth."
RULE_OPTION_SWE_COMMUNISM_DESC: "The Swedish AI will go down the communist tree and either ally the Axis or the Commonwealth"
RULE_OPTION_SWI_COMMONWEALTH_DEMOCRATIC: "Commonwealth Democratic"
RULE_OPTION_SWI_COMMONWEALTH_DEMOCRATIC_AI_DESC: "The AI will arm Switzerland and prepare for war, aligning Switzerland to the democratic powers of the world, eventually breaking neutrality in favor of the Commonwealth"
RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE_DESC: "Adnan Menderes will transition Turkey into a conservative democracy and attempt to join the Commonwealth."
RULE_OPTION_TUR_DEMOCRATIC_KEMALIST_DESC: "Celâl Bayar will transition Turkey into a Kemalist democracy and attempt to join the Commonwealth."
SIA_broadcast_weather_reports_to_the_commonwealth: "Broadcast Weather Reports to the Commonwealth"
SIA_broadcast_weather_reports_to_the_commonwealth_desc: "The skies and seas of the region are governed as much by weather as by fleets and armies. Reliable reports from [ROOT.GetNameDef] can aid Commonwealth planning, shield their operations from surprise and make our homeland a silent but valuable partner in their war."
SIA_commonwealth_integration: "Commonwealth Integration"
SIA_commonwealth_integration_desc: "Our forces must learn to fight alongside the Commonwealth. Command structures, communications, supply procedures, and equipment standards must be brought into line before Siam can become more than a symbolic partner."
SIA_contact_the_south_east_asia_command_desc: "If resistance is to amount to more than brave gestures, it must be tied to a wider strategy. By establishing contact with the Commonwealth command in Southeast Asia, the patriots of [ROOT.GetName] may secure guidance, supplies and a place in the greater struggle."
SIA_join_the_commonwealth: "Join the Commonwealth"
SIA_join_the_commonwealth_desc: "[ROOT.GetName] cannot stand alone while the world is consumed by war. The Commonwealth offer weapons, recognition, and a place among nations resisting aggression. By joining them, we bind Siam's survival to the wider struggle for a free world."
SIA_prepare_for_a_pacific_war_desc: "The eyes of empires are turning toward the Pacific. Japan's ambitions, European colonies, and Commonwealth strategy all point to a coming storm. Siam must prepare before the first shots reach our shores."
SIA_prepare_to_drop_desc: "When the hour of liberation comes, the Commonwealth may seek to descend upon our homeland from the sky. We must therefore identify landing grounds, prepare contacts and organize support networks so that airborne forces can be received and directed where they are most needed."
SIA_reverse_engineer_commonwealth_tanks: "Reverse Engineer Commonwealth Tanks"
SIA_reverse_engineer_commonwealth_tanks_desc: "Others have already borne the expense of experimentation. Captured tanks and imported machines can be stripped apart, studied and imitated. By learning from foreign designs, [ROOT.GetName] may shorten the path toward its own armored force."
SIA_singaporean_reinforcements_desc: "The struggle in Malaya and beyond is inseparable from our own security. Reinforcements drawn from the forces gathering around Singapore could stiffen our line, widen our cooperation with the Commonwealth and bind the theater together under common purpose."
SIA_thai_students_in_the_oss_desc: "A new generation of patriotic youth can be trained abroad in the arts of espionage, sabotage and irregular warfare. By sending trusted Thai students into the orbit of Commonwealth intelligence, we shall prepare able servants for the hidden war ahead."
SOV_approach_germany_desc: "There is no reason why we shouldn't be able to come to accommodation with Germany. We won't be able to peacefully coexist with them forever, of course, but the Germans won't attack us while the western Commonwealth still exist in their back - and we should encourage the Germans to deal with them first."
SOV_fortify_mongolian_border_desc: "While the Japanese hardliners have their eyes on China at the moment, we can not rule out that they might wish to expand their gains by attacking us. We should ensure that our Mongolian Commonwealth don't turn into an open flank."
SOV_seek_a_defense_pact_with_the_commonwealth: "Seek a Defense Pact With the Commonwealth"
SOV_seek_a_defense_pact_with_the_commonwealth_desc: "While there have been informal contacts with the western democracies, little concrete and legally binding has been agreed upon. It is time to put ink on paper and declare to the world that the western democracies are willing to form a Combined Front with us against fascist expansion."
SOV_seek_a_defense_pact_with_the_commonwealth_event_effects_tt: "If [GetCollectiveSecurityTarget] accepts, each nation will sign a Non-Aggression pact and guarantee each other."
SOV_seek_a_defense_pact_with_the_commonwealth_poland_tt: "[GetCollectiveSecurityTargetCaps] might push for the inclusion of [POL.GetFlag]§Y[POL.GetNameDef]§! in the pact."
SOV_seek_a_defense_pact_with_the_commonwealth_target_eng: "[ENG.GetFlag]§Y[ENG.GetNameDef]§!"
SOV_seek_a_defense_pact_with_the_commonwealth_target_eng_caps: "[ENG.GetFlag]§Y[ENG.GetNameDefCap]§!"
SOV_seek_a_defense_pact_with_the_commonwealth_target_fallback: "their government"
SOV_seek_a_defense_pact_with_the_commonwealth_target_fallback_caps: "They"
SOV_seek_a_defense_pact_with_the_commonwealth_target_fra: "[FRA.GetFlag]§Y[FRA.GetNameDef]§!"
SOV_seek_a_defense_pact_with_the_commonwealth_target_fra_caps: "[FRA.GetFlag]§Y[FRA.GetNameDefCap]§!"
SPA_expand_the_axis_gold_trade_desc: "The Axis powers are desperate for trade, straining under the Commonwealth blockade. Their gold flows into our nation, through which they can acquire natural resources from both ourselves and other neutral countries. We profit heavily from this, and so perhaps we should encourage it even further..."
SPA_join_the_commonwealth: "Join the Commonwealth"
SPA_join_the_commonwealth_desc: "It is clear to us in which direction the pendulum is swinging - we will join the Commonwealth, accepting their potent economic aid and ensuring we are on their good side when they inevitably win the war."
SWE_approach_the_commonwealth: "Approach the Commonwealth"
SWE_approach_the_commonwealth_desc: "[ENG.GetNameDefCap] and their allies will ultimately come out as the victors of any conflict in Europe. It would therefore be prudent of us to make clear we have no intention of becoming their foes."
SWE_commonwealth_tech_sharing_group_desc: "A military technology exchange between Sweden and its allies"
SWE_commonwealth_tech_sharing_group_name: "Nordic-Commonwealth Tech Exchange"
SWE_join_commonwealth_for_colonies: "Exchange of Holdings"
SWE_join_commonwealth_for_colonies_desc: "With the strengthening of relations between ourselves and the Commonwealth, we have an opportunity to regain our former colonial holdings around the world in exchange for our entry into their military coalition."
SWI_commonwealth_gold: "Commonwealth Gold"
SWI_commonwealth_gold_desc: "The maelstrom and sanctions that envelop current affairs have made gold trade more limited and difficult, but with our neutral stance we can open the possibility for increased gold trade with other democratic nations, propping up democratic economies to keep fascism at bay."
SWI_join_the_commonwealth: "Join the Alliance"
SWI_join_the_commonwealth_desc: "The material sacrifices and moral compromises that maintaining our neutrality requires are becoming unbearable. There is no place for neutrality anymore, especially with the current political state Europe. Despite their failings, the allies are our best option if we want to preserve our land and our confederation. This truly is a time like no other."
SWI_secret_pact_with_commonwealth_TT: "If we find ourselves in a war, we will immediately join their faction."
SWI_secret_pact_with_the_commonwealth: "Secret Pact with the Commonwealth"
SWI_secret_pact_with_the_commonwealth_desc: "[ROOT.GetName] is not ready for an all-out war, or even to openly join a faction, but we can be certain that we won't be safe without friends. In order to defend our democracy in case of a surprise invasion, we can secretly meet with [?SWI.SWI_best_dem_ally.GetNameDef] and establish an agreement. We will promise to covertly support them start preparing to join the war, in exchange, they will protect us if we are attacked."
SWI_seek_commonwealth_trade: "Seek Commonwealth Trade"
SWI_seek_commonwealth_trade_desc: "With enemies all around us, we need to secure vital trade with the Commonwealth to survive. If we're lucky we can avoid invoking the ire of our other neighbors for seeking closer trade with their rivals."
SWI_support_commonwealth_espionage: "Support Commonwealth Espionage"
SWI_support_commonwealth_espionage_desc: "The fact that we maintain a neutral foreign policy does not prevent us from subversively supporting other democratic nations in their efforts to suppress fascism in Europe. In fact, our neutrality and proximity to [?SWI.SWI_biggest_fascist.GetNameDef] make us vital in the international fight against Fascism."
TUR_bomber_schematics_desc: "It is not enough that we can defend our own skies in wartime, we must be able to strike at the hearts of our enemies so that any war can be brought to a swift conclusion. The Commonwealth are the masters of using the bomb as a tool to ground down their enemies, and there is much we can learn from them."
TUR_join_the_commonwealth: "Join the Commonwealth"
TUR_join_the_commonwealth_desc: "The world has reached a moment of destiny, and we sit at the crossroads of many empires vying to change the world forever. We must stand for the values upon which our country was founded, and fight with the nations of the West in the name of freedom and liberty."
URG_break_diplomatic_relations_with_the_axis_desc: "Despite declaring neutrality is has become clear that the Axis of evil can no longer be tolerated. The winds of the war are strictly in favor of the Commonwealth, and it does not behoove us to be on the losing side."
URG_join_the_commonwealth: "Join the Commonwealth"
URG_join_the_commonwealth_desc: "After pressure from the [USA.GetName] it is clear that we can no longer stay out of the war. What little we can do will now be put into the fight."
USA_neutrality_act_desc: "It seems increasingly certain that war will break out in Europe. During the Great War, American companies sold large quantities of weapons to the Commonwealth, and many believe that the American entry was mostly motivated by a desire to ensure that those deliveries would be paid for. This time, there won't be any war-profiteering."
WW_hungary.1.t: "[HUN.GetName] Launches Commonwealth Manufacturing Programs"
YUG_attract_commonwealth_capital: "Attract Commonwealth Capital"
YUG_attract_commonwealth_capital_desc: "The British have reason to support our nation; we have long been allies since before the first Great War, and by attracting investors from Commonwealth nations, we will reassure them that the relations between our nations are unseverable."
YUG_commonwealth_air_combat_school: "Commonwealth Air Combat School"
YUG_commonwealth_air_combat_school_desc: "Our new allies have extensive experience with air combat. By pushing for a shared Commonwealth Air Combat School we can ensure our pilot recruits are freely taught the valuable lessons our allies bled to learn."
YUG_delcared_war_on_axis_commonwealth: "Declared war on Axis or Commonwealth while in either Axis or Commonwealth"
YUG_join_axis_desc: "Though many would wish for Yugoslavia to join with the Commonwealth powers and resist fascism, we know this is a hopeless ambition bound only to end in war and chaos. We have been given the opportunity to join the Germans, Italians, and Japanese in a pact of mutual military and economic cooperation and we must capitalise on this at once."
YUG_join_commonwealth: "A Royal Alliance"
YUG_join_commonwealth_desc: "Now that our King is happily married, we must make our allegiance known in public, so that we may rely on their military strength should we become the target of our neighbors."
YUG_royal_alliance_tt: "We will attempt to join the faction of our royal marriage partner.\nIn the event that our partner is Princess Alexandra, we will attempt to join the Commonwealth."
baltic_commonwealth_research_desc: "Reduced research time for technologies researched by the Baltic States and their allies."
baltic_commonwealth_research_name: "Baltic Research"
bba_news.201.b: "The Commonwealth are not to be trusted."
bba_news.201.desc: "Despite a [POL.GetAdjective] government in exile operating from London during the war, the Commonwealth have chosen to recognize the [SOV.GetAdjective] groomed communists as the legitimate government of [POL.GetName]. Diplomatic sources indicate that an agreement was made between the Commonwealth and the [SOV.GetName] over the post-war division of Europe into spheres of influence. Unfortunately for the [POL.GetAdjective] government in London, a major stumbling block to [SOV.GetAdjective] agreement was [SOV.GetLeader]’s desire for Poland to be part of the [SOV.GetAdjective] sphere of influence.\n\nWhile many will consider this a betrayal of [POL.GetName], others argue that with [SOV.GetAdjective] forces already occupying the country, there was little reason in rejecting their ultimatum and jeopardizing the future stability of Europe."
bftb_bulgaria_democratic_international_policies.4.desc: "A delegation from [BUL.GetNameDef] has arrived in our country to request that [ROOT.GetLeader] recognize the legitimacy of the [BUL.GetAdjective] government in the former Bulgarian territories currently occupied by Commonwealth troops and, consequently, return administrative control of the region to [BUL.GetNameDef]."
bftb_bulgaria_democratic_international_policies.5.desc: "Our delegation sent to [ENG.GetNameDef] has returned after having succeeded in their petition to the [ENG.GetAdjective] government, which has agreed to return administrative control of former Bulgarian territories occupied by Commonwealth troops to [BUL.GetNameDef]."
bftb_bulgaria_democratic_international_policies.6.desc: "Unfortunately, our delegation sent to [ENG.GetNameDef] failed to get the [ENG.GetAdjective] government to grant us administrative control of the former Bulgarian territories currently occupied by Commonwealth troops."
bftb_bulgaria_tsar_boris.3.b: "Form a pro-Commonwealth government."
britain.13.d: "The world is growing increasingly unsafe. Britain and France remain bastions of democracy and liberty in Europe and France now propose that they join the Commonwealth.\nHow should we reply?"
britain.13.t: "France wants to join Commonwealth"
britain.25.desc: "The [ENG.GetAdjective] government, seemingly alarmed after the fall of [DEN.GetNameDef] alongside the presence of [GER.GetAdjective] diplomats in [ICE.GetNameDef] has invited us to join the Commonwealth as co-belligerents. They cite concerns about their national security in which the [GER.GetNameDef] could potentially use Icelandic bases as a springboard for raids on English convoys or cities.\nTheir threats were thinly veiled, citing the current world situation that any claims of “supposed neutrality” from our side is eclipsed by the safety of British citizens and the war against fascism."
churchill_plan_germany_tt: "Germany will be split up into three countries. A West German, State, a North German State, and a South German State, also incorporating some parts of the Austro-Hungarian Empire. All of these are to be in the Commonwealth Sphere of influence, while the rest of Central and Eastern Europe will be in the [yalta_partner.GetAdjective] Sphere of Influence. "
cominwealth_commonwealth_research_desc: "Reduced research time for technologies researched by the members of the Cominwealth."
cominwealth_commonwealth_research_name: "Cominwealth Research"
commonwealth_TITLE: "Commonwealth"
commonwealth_peace_1: "Morning of D-day"
commonwealth_peace_2: "End of the Tour"
commonwealth_speeches_TITLE: "Commonwealth Speeches"
commonwealth_war_1: "We Are Soldiers"
commonwealth_war_2: "The Royal Air Force"
commonwealthfaction: "Commonwealth Faction"
elected_regency_council_pro_commonwealth: "Elected Regency Council"
fall_gelb_desc: "The Maginot Line would make a direct assault on France from across our border very costly. Borrowing from the Schlieffen Plan, the OKH have prepared for an invasion through the Low Countries instead. If possible, isolate and destroy Commonwealth forces crossing into Belgium by driving a wedge between them and the rest of France."
france.29.d: "'History has shown how much can be accomplished when our great nations stand side by side. In the spirit of the Entente Cordiale, we are proud to welcome you not only as friends, but as Commonwealth. Together we will be a shining beacon of liberty in a world encroached by the darkness of oppression!'\n\nOur request to join Britain as Commonwealth has been accepted. We can count on their full support in the turbulent times ahead."
france.30.d: "'While we have enjoyed good relations in the past, we cannot risk an escalation of the conflicts across the channel. Germany has earned our trust in the honoring of our Naval Pact, and while we will defend ourselves should the fires spread we will not risk fanning the flames. Peace must always be the goal of any democratic nation.'\n\nOur request to join Britain as Commonwealth has been denied. The British government is unwilling to antagonize Germany further, and will not jeopardize the current peace."
germany.1190.desc: "With the war against [GER.GetNameDef] marching towards its inevitable conclusion, [yalta_origin.GetNameDef] has approached us about a conference on the future of Europe.\n\nThey are suggesting a three way split of [GER.GetNameDef] in which we will get limited influence over the Eastern region. The main industrial region would come under allied control, and the Commonwealth would also have limited control over the Southern region. It would reduce Germany's power, however our influence over central Europe will remain uncertain."
germany.43.t: "France leaves the Commonwealth"
germany.44.d: "German demands for our territory in the Sudetenland region have become increasingly hostile, and now their forces are massing along our border! A conference is being held in Munich where European leaders are discussing the future of Czechoslovakia, but we haven't been invited.\n\nFortunately, it looks like the Commonwealth will stand by their earlier promises of support. They have threatened [GER.GetLeader] with war if our borders are violated in the slightest. Despite this, we must prepare for an imminent German attack."
germany.47.d: "Talks have been held in Munich between the leaders of Germany, Britain, France and Italy to discuss the future of Czechoslovakia. The British and their Commonwealth have both rejected our rightful claims to the Sudetenland, and they have threatened us with war if we 'violate' the Czech border!\n\nA plan for the invasion of Czechoslovakia has been drawn up, but this will likely trigger a general European war. We must make certain we are ready for this."
idea_RAJ_commonwealth_equipment_support: "Commonwealth Equipment Support"
idea_SIA_seri_thai_contacts_desc: "Contacts with the Seri Thai resistance network are proving their worth, bringing in experienced fighters and strengthening ties with the Commonwealth."
invade_australia_desc: "The time has come to conduct a full-scale invasion of Australia. This will permanently remove the largest bastion of Commonwealth power in the Pacific and secure the southern flank of the Greater East Asian Co-Prosperity Sphere."
invasion_of_south_africa_desc: "Our unstoppable forces are now in a position to strike at South Africa. Its conquest should make it very difficult for Commonwealth naval units to enter the Indian Ocean without use of the Suez Canal. The decadent British Empire is unraveling before our eyes."
isolate_australia_desc: "Australia is vital to the Commonwealth war effort in the Pacific, and it must not be allowed to serve as a base where forces are marshaled against Japan and its rightful conquests. By taking key islands in the southwestern Pacific, we can isolate Australia from the United States."
kaiser_challenge_met_desc: "After predictions that the Kaiser could be freed from the Netherlands without Commonwealth intervention, Germany ended up pressured to back down after this turned out to be a mistake."
likes_commonwealth: "Likes the Commonwealth"
maintheme: "Main Theme - Commonwealth"
mtg_britain.15_tt: "We will become independent and leave the Commonwealth if Edward VIII does not change his mind.\n"
news.109.d: "Forces from the Deutsches Afrikakorps have fought their way to Cairo, the capital city of Egypt. \n\nAs Commonwealth forces retreated further into the desert in disarray, German soldiers marching through Cairo were cheered as liberators by many citizens who had come to view the British as oppressors.\n\nThe fall of Cairo is a significant loss to the Commonwealth war effort, and several experts have speculated that all of the Middle East now lies open to German conquest."
news.132.d: "Commonwealth forces recently entered Rome after the surrender of its garrison, and the city is now under military occupation. Most historical landmarks remain intact, having weathered yet another battle for control over the city. For now at least, Commonwealth troops have stayed outside Vatican City at the request of the Holy See.\n\nThe fall of Rome is an important milestone in the Italian campaign, and some are wondering if this means an end of the organized resistance to the advancing Commonwealth armies on the peninsula."
news.134.d: "It has now been confirmed that Paris, the capital of France, has been liberated from German occupation. Commonwealth forces have entered the city, and the remaining German garrison has surrendered. Parisians could be seen cheering their liberators as they marched down the Champs Élysées, even while there were rumors of German sniper fire in some parts of the city.\n\nIt was feared that the Germans would employ a strategy of scorched earth and leave Paris a burning ruin, but the city's landmarks appear to have been spared. Indeed, the French tricolor can even now be seen flying from the Eiffel Tower."
news.136.d: "After a series of pitched battles, Commonwealth forces have occupied Moscow, capital of [SOV.GetNameDef]. The city has suffered extensive damage, and fires are still raging on both sides of the Moskva river. Despite heavy bombing the Kremlin is reasonably intact, and it has been chosen as the location for the headquarters of the Commonwealth Occupation Administration.\n\nWith the loss of Moscow, the Soviet war effort has suffered an enormous blow. Although most of the government is believed to have evacuated the city well in advance of its fall, military experts claim that a complete Soviet collapse may not be far away."
news.151.d: "After attempts by Germany to end the rules set by the Versailles Treaty and re-militarize the Rhineland, an ultimatum from the Commonwealth forced them to back down. With both Britain and France threatening to mobilize if Germany proceeded with the plan, it quickly became clear that this level of resistance was unexpected. Germany was not prepared to face both countries in all-out war.\n\nAs it stands, the Rhineland will remain a demilitarized zone as dictated by the treaty unless Germany goes to war."
news.298.desc: "In a public declaration, [HUN.GetLeader] has renounced the treaty imposed by the Commonwealth powers after the Great War. Signed by the [HUN.GetAdjective]s under protest, in 1920, it greatly reduced the country's size and limited the strength of its military.\n\nIn his speech, [HUN.GetLeader] already hinted that Hungary may soon look towards reaffirming their claims on the territories taken from them two decades ago."
news.57.d: "German demands for the Sudeten border territory in Czechoslovakia, which is home to a considerable German minority, have intensified recently. \n\nAt a summit held in Munich, Germany, Britain, France and Italy sought to find a diplomatic solution to the so-called 'Sudeten Crisis.'\n\nThe talks appear to have failed, however, with both Britain and its Commonwealth uttering stern warnings to Germany that if its troops crosses the Czechoslovakian border, the result would be war. \n\nTime seems to be running out for a peaceful solution to the dispute."
operation_felix_desc: "Commonwealth operations in the Mediterranean must be curtailed by closing off the Strait of Gibraltar, but the Spanish cannot be relied on to support our cause. We must force the issue by launching a full-scale invasion across the Pyrenees. Both Spain and Portugal need to be occupied in order to safeguard Germany's southwestern flank."
operation_gertrude_desc: "The occupation of Turkey will allow us to more easily shift forces from Europe to the Middle East, and it will give us full control over the only entrance to the Black Sea. Under no circumstances must the Turks be permitted to align with the Commonwealth!"
operation_herkules_desc: "The British base on Malta has been a thorn in our side for too long. It continues to interfere with operations in North Africa, and as long as the island is under Commonwealth control the Central Mediterranean will remain contested. We must see to its capture."
operation_weserubung_desc: "Scandinavian iron is critical to the German war industry, and our supply must be safeguarded. We will preempt an Commonwealth occupation of Norway by staging an invasion of our own. As a step towards realizing this goal, Denmark must also be occupied. This will have the added benefit of closing off the Baltic Sea to our enemies."
poland.1.d: "Having been forced to cede Gdansk to the Germans, we are now locked in a vise between two empires threatening our sovereignty. As we're losing territory in the west, not being able to trust the Commonwealth to protect us from German aggression, we could consider aligning with the German ambitions and reclaim portions of our old Commonwealth now absorbed into [SOV.GetNameDef]. We will be easy prey if we remain neutral, and have fought too hard to see another partition of Poland."
pro_commonwealth_governor_general: "Pro-Commonwealth Governor-General"
pro_commonwealth_governor_general_2: "Pro-Commonwealth Governor-General"
pro_commonwealth_politician: "Pro-Commonwealth Politician"
rhineland_challenge_met_desc: "After predictions that the Rhineland could be remilitarized without Commonwealth intervention, Germany ended up pressured to back down after this turned out to be a mistake."
secure_the_indian_ocean_desc: "We must establish control over the Indian Ocean to prevent Commonwealth fleet movements towards Asia. Several objectives must be seized, including Madagascar off the coast of Africa. The island could be used as a base from which to disrupt British convoys bound for the Middle East."
wtt_news.61.desc: "Having secured all of the pre-war Ottoman lands, the [From.GetOldAdjective] government, as representatives of the Ottoman successor state, has now begun with re-integrating these territories. Government-directed propaganda has flared up, denouncing the partitions of the Commonwealth in the Great War, and extolling the "glorydays of the Empire" in a clear effort to rally the population of newly-conquered lands behind the wide-spread national reforms and a return to imperial norms.\n\nAs a part of these, the [From.GetOldAdjective] government has announced the restoration of [From.GetNameDef], and has changed the nation's official name to reflect this."
wuw_HUN_commonwealth_manufacturing_programs: "Commonwealth Manufacturing Programs"
wuw_HUN_commonwealth_manufacturing_programs_desc: "Our industry may be strong on its own, but it cannot compete with any of the world powers. We should therefore produce new planes in allied facilities, in exchange for paying them back in Pengö."
wuw_HUN_commonwealth_manufacturing_programs_tt: "Our Faction Leader will gain 2 §YOffmap Civilian Factories§! and §Y1x§! §G50%§! research speed bonus to §YAir Equipment§!"
wuw_HUN_join_the_commonwealth: "Join the Commonwealth"
wuw_HUN_join_the_commonwealth_desc: "The future of Hungary and its democratic values lies with the major Western democracies and their alliance. As a member of this alliance, we may lend our strength to theirs, as well as count on their support ourselves."
