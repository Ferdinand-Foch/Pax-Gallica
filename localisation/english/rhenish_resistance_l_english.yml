rhenish_occupation: "Rhenish Occupation"
rhenish_occupation_desc: "Resistance remains contained in the Rhenish departments under French administration. Local contacts provide Germany with civilian, army, naval and air intelligence on France."
rhenish_concern: "Rhenish Unrest"
rhenish_concern_desc: "Opposition to French administration is organizing in the Rhenish departments. The unrest unsettles public opinion while local networks strengthen German intelligence on France."
rhenish_crisis: "Rhenish Crisis"
rhenish_crisis_desc: "Unrest in the most resistant Rhenish department undermines confidence in the French government. Resistance networks provide Germany with information in all four intelligence domains."
rhenish_insurrection: "Rhenish Insurrection"
rhenish_insurrection_desc: "Armed resistance in the Rhenish departments shakes French stability. German contacts have extensive information on French civilian affairs and land, naval and air forces."
rhenish_uprising: "Rhenish Uprising"
rhenish_uprising_desc: "The uprising in the most resistant Rhenish department provokes a deep crisis of confidence in France. Local networks supply Germany with extensive intelligence on French institutions and armed forces."

